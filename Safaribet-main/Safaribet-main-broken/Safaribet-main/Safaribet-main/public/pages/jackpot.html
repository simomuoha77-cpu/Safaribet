<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Jackpot – SafariBet</title>
<script src="/js/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--g:#00c853;--bg:#080c08;--s1:#0d120d;--s2:#131a13;--s3:#192019;--bd:rgba(0,200,83,0.08);--tx:#e0f0e0;--mt:#4a6a4a;--yl:#ffd600;--rd:#ff3b3b}
html[data-theme="light"]{--g:#00a844;--bg:#f4f7f4;--s1:#ffffff;--s2:#eef3ee;--s3:#e4ece4;--bd:rgba(0,140,58,0.18);--tx:#14231a;--mt:#5c7a63;--yl:#b8860b;--rd:#d32f2f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:40px}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--s1);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10}
.back{font-size:20px;background:none;border:none;color:var(--tx);cursor:pointer}
.tb-ttl{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700}

.pool-hero{text-align:center;padding:28px 16px;background:linear-gradient(135deg,rgba(0,200,83,0.12),rgba(0,200,83,0.02))}
.pool-lbl{font-size:12px;color:var(--mt);text-transform:uppercase;letter-spacing:1px}
.pool-amt{font-family:'Rajdhani',sans-serif;font-size:42px;font-weight:800;color:var(--g);margin:6px 0}
.pool-sub{font-size:11px;color:var(--mt)}

.main{padding:14px}
.fx-card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.fx-teams{font-weight:700;font-size:14px;margin-bottom:2px}
.fx-league{font-size:10px;color:var(--mt);text-transform:uppercase;margin-bottom:10px}
.fx-picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fx-pick{background:var(--s2);border:1.5px solid var(--bd);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer}
.fx-pick-lbl{font-size:12px;font-weight:700}
.fx-pick-odds{font-size:11px;font-weight:600;color:var(--mt);margin-top:2px}
.fx-pick.sel{background:var(--g);border-color:var(--g);color:#04140a}
.fx-pick.sel .fx-pick-odds{color:#04140a;opacity:0.75}
.fx-pick.correct{background:rgba(0,200,83,0.18);border-color:var(--g);color:var(--g)}
.fx-pick.correct .fx-pick-odds{color:var(--g);opacity:0.8}
.fx-pick.wrong{background:rgba(255,59,59,0.12);border-color:var(--rd);color:var(--rd)}
.fx-pick.wrong .fx-pick-odds{color:var(--rd);opacity:0.8}

.countdown-bar{display:flex;justify-content:center;gap:10px;padding:0 16px 20px}
.cd-unit{background:rgba(0,0,0,0.25);border-radius:8px;padding:8px 12px;text-align:center;min-width:52px}
.cd-num{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:800;color:var(--g)}
.cd-lbl{font-size:9px;color:var(--mt);text-transform:uppercase;letter-spacing:0.5px}

.quick-actions{display:flex;justify-content:space-between;gap:10px;padding:0 14px 10px}
.qa-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;font-size:12px;font-weight:700;color:var(--tx);cursor:pointer}
.qa-btn:active{opacity:0.7}
.fx-result-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;margin-left:6px;display:inline-block}
.fx-result-tag.pending{background:rgba(255,214,0,0.12);color:var(--yl)}
.fx-result-tag.done{background:rgba(0,200,83,0.12);color:var(--g)}
.status-banner{text-align:center;padding:16px;border-radius:12px;margin:14px;font-size:14px;font-weight:700}
.status-banner.pending{background:rgba(255,214,0,0.08);border:1px solid rgba(255,214,0,0.25);color:var(--yl)}
.status-banner.won{background:rgba(0,200,83,0.1);border:1px solid rgba(0,200,83,0.3);color:var(--g)}
.status-banner.lost{background:rgba(255,59,59,0.08);border:1px solid rgba(255,59,59,0.25);color:var(--rd)}
.status-banner .sub{font-size:12px;font-weight:400;color:var(--mt);margin-top:4px}

.enter-bar{position:sticky;bottom:0;background:var(--s1);border-top:1px solid var(--bd);padding:14px 16px;margin-top:10px}
.enter-progress{font-size:12px;color:var(--mt);margin-bottom:8px;text-align:center}
.enter-btn{width:100%;padding:14px;background:var(--g);color:#04140a;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer}
.enter-btn:disabled{opacity:0.4;cursor:not-allowed}
.res{margin-top:8px;font-size:12px;text-align:center}
.res.ok{color:var(--g)}
.res.er{color:var(--rd)}

.empty{text-align:center;padding:60px 20px;color:var(--mt);font-size:13px}
.already-entered{text-align:center;padding:16px;background:rgba(0,200,83,0.08);border:1px solid rgba(0,200,83,0.2);border-radius:12px;margin:14px;font-size:13px}
</style>
</head>
<body>

<div class="topbar">
  <button class="back" onclick="history.back()">←</button>
  <div class="tb-ttl">🏆 Jackpot</div>
</div>

<div id="content">
  <div class="empty">Loading jackpot…</div>
</div>

<script>
let round = null;
let myEntry = null;
let picks = {}; // matchId -> pick
let resultsMode = false; // true when showing a finished round's results rather than the picker
let countdownTimer = null;

async function init(){
  try {
    const r = await fetch('/api/jackpot/current');
    const d = await r.json();
    const token = localStorage.getItem('token');

    if (d.success && d.round) {
      // There's an open/locked round right now — normal picker flow.
      round = d.round;
      resultsMode = false;
      if (token) {
        const er = await fetch(`/api/jackpot/my-entry/${round._id}`, { headers: { 'Authorization': 'Bearer '+token } });
        const ed = await er.json();
        if (ed.success) myEntry = ed.entry;
      }
      render();
      return;
    }

    // No open/locked round right now — but if the user has a recent entry
    // whose round has since moved to awaiting_approval/settled, show its
    // results instead of just "no active jackpot". Without this, results
    // become invisible the moment a round finishes.
    if (token) {
      const lr = await fetch('/api/jackpot/my-latest-entry', { headers: { 'Authorization': 'Bearer '+token } });
      const ld = await lr.json();
      if (ld.success && ld.entry && ld.round && ld.round.status !== 'open' && ld.round.status !== 'locked') {
        round = ld.round;
        myEntry = ld.entry;
        resultsMode = true;
        render();
        return;
      }
    }

    document.getElementById('content').innerHTML = '<div class="empty">No active jackpot right now — check back soon.</div>';
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="empty">Failed to load — check connection.</div>';
  }
}

function render(){
  const el = document.getElementById('content');
  const hasGuarantee = round.guaranteedPrize > 0;
  const potentialWinnings = hasGuarantee ? round.guaranteedPrize : round.poolAmount;
  const graded = round.status === 'awaiting_approval' || round.status === 'settled'; // correctCount/isWinner are real by this point, even if payout is still pending admin approval

  let html = `
    <div class="pool-hero">
      <div class="pool-lbl">${round.name}${hasGuarantee ? ' · Guaranteed Prize' : ''}</div>
      <div class="pool-amt">KES ${potentialWinnings.toLocaleString()}</div>
      <div class="pool-sub">${round.entryCount || 0} entries so far · Entry fee KES ${round.entryFee} · Predict all ${round.fixtures.length} correctly to win a share</div>
    </div>`;

  // Live countdown to when entries close (first fixture's kickoff) — only
  // meaningful while the round is still actually open for entries.
  if (round.status === 'open' && !myEntry) {
    const firstKickoff = round.fixtures.reduce((min, f) => new Date(f.commenceTime) < new Date(min) ? f.commenceTime : min, round.fixtures[0]?.commenceTime);
    html += `
      <div class="countdown-bar" id="countdownBar" data-deadline="${firstKickoff}">
        <div class="cd-unit"><div class="cd-num" id="cdD">--</div><div class="cd-lbl">Days</div></div>
        <div class="cd-unit"><div class="cd-num" id="cdH">--</div><div class="cd-lbl">Hours</div></div>
        <div class="cd-unit"><div class="cd-num" id="cdM">--</div><div class="cd-lbl">Mins</div></div>
        <div class="cd-unit"><div class="cd-num" id="cdS">--</div><div class="cd-lbl">Secs</div></div>
      </div>
      <div class="quick-actions">
        <div class="qa-btn" onclick="autoPick()">🎲 Auto Pick</div>
        <div class="qa-btn" onclick="clearPicks()">🗑️ Clear All</div>
      </div>`;
  }

  html += `<div class="main">`;

  // ── STATUS BANNER — the actual fix: tell the user clearly where things stand ──
  if (myEntry) {
    if (!graded) {
      html += `<div class="status-banner pending">⏳ Entry placed — pending<div class="sub">Results will appear here once every fixture finishes.</div></div>`;
    } else if (myEntry.isWinner) {
      const paid = !!myEntry.creditedAt;
      html += `<div class="status-banner won">🎉 You won! KES ${(myEntry.payout||0).toLocaleString()}<div class="sub">${paid ? 'Already credited to your wallet.' : 'Approved winners are credited shortly — check your wallet soon.'}</div></div>`;
    } else {
      html += `<div class="status-banner lost">Not this time<div class="sub">You got ${myEntry.correctCount}/${round.fixtures.length} correct — a perfect score is needed to win a share.</div></div>`;
    }
  } else if (round.status !== 'open') {
    html += `<div class="already-entered">🔒 Entries closed — the first fixture has already kicked off.</div>`;
  }

  round.fixtures.forEach(fx => {
    const locked = myEntry || round.status !== 'open';
    const myPick = myEntry ? myEntry.predictions.find(pr=>pr.matchId===fx.matchId)?.pick : picks[fx.matchId];
    const fixtureDone = fx.result != null; // this specific fixture has a real result, independent of whether the whole round is graded yet
    html += `
      <div class="fx-card">
        <div class="fx-teams">${fx.homeTeam} vs ${fx.awayTeam}${fixtureDone ? `<span class="fx-result-tag done">FT</span>` : (round.status!=='open' ? `<span class="fx-result-tag pending">Pending</span>` : '')}</div>
        <div class="fx-league">${fx.league || ''} · ${new Date(fx.commenceTime).toLocaleString([], {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}</div>
        <div class="fx-picks">
          ${['home','draw','away'].map(p => {
            const sel = myPick === p;
            const label = p==='home' ? fx.homeTeam : p==='away' ? fx.awayTeam : 'Draw';
            const price = fx.odds ? fx.odds[p] : null;
            // Once this fixture has a real result: show green if this was the
            // actual outcome, red if the user picked this and it was wrong —
            // otherwise fall back to the plain "selected" look pre-result.
            let cls = sel ? 'sel' : '';
            if (fixtureDone) {
              if (p === fx.result) cls = 'correct';
              else if (sel) cls = 'wrong';
              else cls = '';
            }
            return `<div class="fx-pick ${cls}" ${locked?'':`onclick="selectPick('${fx.matchId}','${p}')"`}>
              <div class="fx-pick-lbl">${label}</div>
              ${price != null ? `<div class="fx-pick-odds">${price.toFixed(2)}</div>` : ''}
            </div>`;
          }).join('')}
        </div>
      </div>`;
  });

  html += `</div>`;

  if (!myEntry && round.status === 'open') {
    const done = Object.keys(picks).length;
    html += `
      <div class="enter-bar">
        <div class="enter-progress">${done} / ${round.fixtures.length} predicted</div>
        <button class="enter-btn" id="enterBtn" ${done<round.fixtures.length?'disabled':''} onclick="enterJackpot()">Enter for KES ${round.entryFee}</button>
        <div class="res" id="enterRes"></div>
      </div>`;
  }

  el.innerHTML = html;

  if (round.status === 'open' && !myEntry) startCountdown();
}

// Fills every fixture with a random pick in one tap — same convenience
// feature Betika's jackpot board offers, for anyone who just wants to get an
// entry in without deliberating over all 15+ matches individually.
function autoPick(){
  const options = ['home','draw','away'];
  round.fixtures.forEach(fx => {
    picks[fx.matchId] = options[Math.floor(Math.random() * 3)];
  });
  render();
}

function clearPicks(){
  picks = {};
  render();
}

function startCountdown(){
  if (countdownTimer) clearInterval(countdownTimer);
  const bar = document.getElementById('countdownBar');
  if (!bar) return;
  const deadline = new Date(bar.dataset.deadline).getTime();
  const tick = () => {
    const diff = deadline - Date.now();
    if (diff <= 0) { clearInterval(countdownTimer); init(); return; } // deadline passed — reload to pick up the now-locked state
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = String(v).padStart(2,'0'); };
    set('cdD', d); set('cdH', h); set('cdM', m); set('cdS', s);
  };
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function selectPick(matchId, pick){
  picks[matchId] = pick;
  render();
}

async function enterJackpot(){
  const token = localStorage.getItem('token');
  if (!token) { location.href = '/login'; return; }
  const el = document.getElementById('enterRes');
  el.className = 'res'; el.textContent = 'Entering...';
  try {
    const predictions = Object.entries(picks).map(([matchId, pick]) => ({ matchId, pick }));
    const r = await fetch('/api/jackpot/enter', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ roundId: round._id, predictions })
    });
    const d = await r.json();
    if (d.success) {
      el.className = 'res ok'; el.textContent = '✅ Entered! Good luck.';
      setTimeout(init, 1200);
    } else {
      el.className = 'res er'; el.textContent = '❌ ' + (d.message || 'Failed to enter');
    }
  } catch(e) {
    el.className = 'res er'; el.textContent = '❌ Failed — check connection';
  }
}

init();
</script>
</body>
</html>
