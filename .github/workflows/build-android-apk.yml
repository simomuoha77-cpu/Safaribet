name: Build Android APK

# Run it by hand: GitHub -> Actions -> "Build Android APK" -> Run workflow. The signed APK appears under "Artifacts".
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown to users (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ github.run_number }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-migration

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare icon and splash from the website artwork
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick fonts-dejavu-core
          IM=$(command -v magick || command -v convert)
          mkdir -p resources
          "$IM" ../public/icon-512.png -resize 1024x1024 resources/icon.png
          "$IM" -size 2732x2732 xc:'#0a0e0a' \( ../public/icon-512.png -resize 1200x1200 \) -gravity center -composite resources/splash.png
          cp resources/splash.png resources/splash-dark.png

      - name: Create Android project
        run: npx cap add android

      - name: Create launch-screen logo (SafariBet wordmark)
        run: |
          IM=$(command -v magick || command -v convert)
          mkdir -p android/app/src/main/res/drawable-nodpi
          "$IM" -background none -fill '#00c853' -font DejaVu-Sans-Bold -pointsize 200 label:Safari \
            \( -background none -fill '#ffd600' -font DejaVu-Sans-Bold -pointsize 200 label:Bet \) +append -trim +repage \
            -resize 700x -background none -gravity center -extent 1152x1152 android/app/src/main/res/drawable-nodpi/splash_logo.png

      - name: Generate launcher icons and splash screens
        run: >
          npx @capacitor/assets generate --android
          --iconBackgroundColor '#0a0e0a' --iconBackgroundColorDark '#0a0e0a'
          --splashBackgroundColor '#0a0e0a' --splashBackgroundColorDark '#0a0e0a'

      - name: Apply SafariBet settings
        run: node scripts/patch-android.js

      - name: Sync
        run: npx cap sync android

      - name: Build release APK
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare signing key
        run: |
          mkdir -p "$RUNNER_TEMP/sign"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sign/release.keystore"
            echo "Using your saved signing key."
            echo "NEW_KEY=0" >> "$GITHUB_ENV"
          else
            echo "No saved signing key yet: creating one. SAVE IT (see the 'signing-key-SAVE-THIS' artifact)."
            GEN_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/sign/release.keystore" -alias safaribet -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$GEN_PASS" -keypass "$GEN_PASS" -dname "CN=SafariBet, O=SafariBet, C=KE"
            echo "KS_PASS=$GEN_PASS" >> "$GITHUB_ENV"
            echo "KS_ALIAS=safaribet" >> "$GITHUB_ENV"
            echo "NEW_KEY=1" >> "$GITHUB_ENV"
            mkdir -p "$RUNNER_TEMP/keyout"
            {
              echo "Add these 3 repository secrets (Settings > Secrets and variables > Actions):"
              echo "ANDROID_KEYSTORE_PASSWORD = $GEN_PASS"
              echo "ANDROID_KEY_ALIAS = safaribet"
              echo "ANDROID_KEYSTORE_BASE64 = (the long text in keystore-base64.txt)"
              echo "Then delete this artifact. Keep a private backup: without this key you cannot update the app for existing users."
            } > "$RUNNER_TEMP/keyout/README.txt"
            base64 -w0 "$RUNNER_TEMP/sign/release.keystore" > "$RUNNER_TEMP/keyout/keystore-base64.txt"
          fi

      - name: Align and sign
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p "$RUNNER_TEMP/out"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/out/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/sign/release.keystore" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" \
            --out "$RUNNER_TEMP/out/SafariBet-$VERSION_NAME.apk" "$RUNNER_TEMP/out/aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/out/SafariBet-$VERSION_NAME.apk"

      - name: Show signing fingerprint (needed so links open in the app)
        run: |
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/sign/release.keystore" -storepass "$KS_PASS" -alias "$KS_ALIAS" 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          echo "SHA-256 fingerprint: $FP"
          echo "### App signing fingerprint" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$FP\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafariBet-${{ inputs.version_name }}-apk
          path: ${{ runner.temp }}/out/SafariBet-${{ inputs.version_name }}.apk
          if-no-files-found: error

      - name: Upload new signing key (first run only)
        if: env.NEW_KEY == '1'
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-SAVE-THIS
          path: ${{ runner.temp }}/keyout
          retention-days: 3
