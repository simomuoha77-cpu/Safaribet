<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SafariBet - connecting</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#0a1410;color:#e9f5ee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
.logo{font-size:34px;font-weight:800;letter-spacing:1px;color:#00d95f;margin-bottom:22px}
.logo b{color:#fff}
.spin{width:38px;height:38px;border:4px solid rgba(255,255,255,.15);border-top-color:#00d95f;border-radius:50%;margin:0 auto 18px;animation:s 0.9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
h1{font-size:18px;margin:0 0 8px}
p{margin:0 0 20px;color:#8fa89a;font-size:14px;line-height:1.5}
button{background:#00d95f;color:#04210f;border:0;border-radius:10px;padding:12px 26px;font-size:15px;font-weight:700}
</style></head>
<body><div>
<div class="logo">Safari<b>Bet</b></div>
<div class="spin"></div>
<h1 id="t">Connecting to SafariBet...</h1>
<p id="m">The server is waking up. This usually takes a few seconds - the page opens by itself.</p>
<button onclick="ping(true)">Try now</button>
</div>
<script>
var tries = 0, busy = false;
function next(){ tries++; busy = false; setTimeout(ping, Math.min(1500 + tries * 700, 5000)); }
function ping(manual){
  if (busy && !manual) return; busy = true;
  fetch('/api/health', { cache: 'no-store' }).then(function(r){ if (r.ok) location.reload(); else next(); }).catch(next);
}
addEventListener('online', function(){ ping(true); });
document.addEventListener('visibilitychange', function(){ if (!document.hidden) ping(true); });
ping();
</script></body></html>
