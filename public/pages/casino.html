<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Casino – SafariBet</title>
<script src="/js/theme.js"></script>
<script src="/js/router.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<style>
:root{--g:#00c853;--bg:#0a0e0a;--s2:#182018;--s3:#1e271e;--bd:rgba(0,200,83,.12);--tx:#e8f5e9;--mt:#789078;--yl:#ffd600;--rd:#ff4b4b;--hdr:rgba(8,12,8,.98)}
html[data-theme="light"]{--bg:#f4f7f4;--s2:#eef3ee;--s3:#e4ece4;--tx:#14231a;--mt:#5c7a63;--hdr:rgba(255,255,255,.98)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:Inter,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
header{height:54px;position:fixed;top:0;left:0;right:0;z-index:20;background:var(--hdr);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:10px}.back{color:var(--g);text-decoration:none;font-size:22px}.logo{font:800 21px Rajdhani;color:var(--g)}.logo span{color:var(--yl)}.bal{margin-left:auto;padding:6px 10px;border:1px solid var(--bd);border-radius:9px;color:var(--g);font-size:13px;font-weight:800;background:var(--s2)}
main{padding:54px 0 70px}.hero{padding:24px 16px;background:linear-gradient(135deg,#003d1a,#061006);border-bottom:1px solid var(--bd)}.hero h1{font:800 29px Rajdhani}.hero p{font-size:12px;color:var(--mt);margin-top:4px}.section{padding:16px 12px 8px;font-size:11px;font-weight:800;color:var(--mt);text-transform:uppercase;letter-spacing:.8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px}.card{background:var(--s2);border:1px solid var(--bd);border-radius:15px;overflow:hidden;cursor:pointer}.art{height:120px;display:flex;align-items:center;justify-content:center;font-size:58px;background:radial-gradient(circle at 50% 30%,#154d27,#0b120b);position:relative}.art img{width:100%;height:100%;object-fit:cover;display:block}.art .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:0}.art img{position:relative;z-index:1}.art.noimg img{display:none}.body{padding:11px}.name{font-size:14px;font-weight:800}.meta{font-size:11px;color:var(--mt);margin-top:3px}.tag{display:inline-block;margin-top:8px;padding:3px 7px;border-radius:999px;border:1px solid rgba(0,200,83,.2);color:var(--g);font-size:9px;font-weight:800;text-transform:uppercase}.msg{padding:36px 18px;text-align:center;color:var(--mt);font-size:13px}.retry{margin-top:12px;border:0;border-radius:9px;padding:10px 18px;background:var(--g);font-weight:800;cursor:pointer}
.screen{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);flex-direction:column}.screen.on{display:flex}.top{height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--hdr);border-bottom:1px solid var(--bd)}.close{font-size:23px;color:var(--g);cursor:pointer}.title{flex:1;font-weight:800}.screenbal{font-size:12px;font-weight:800;color:var(--g)}.game{flex:1;overflow:auto;padding:14px}.round{background:var(--s2);border:1px solid var(--bd);border-radius:16px;padding:18px;text-align:center}.game-name{font-size:11px;color:var(--mt);text-transform:uppercase;font-weight:800;letter-spacing:.8px}.mult{font:800 64px Rajdhani;margin:20px 0 5px;color:var(--g)}.status{font-size:12px;color:var(--mt);min-height:18px}.history{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}.h{font-size:10px;font-weight:800;padding:5px 7px;border-radius:7px;background:var(--s3)}.controls{margin-top:12px;background:var(--s2);border:1px solid var(--bd);border-radius:16px;padding:14px}.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slot{border:1px solid var(--bd);background:var(--s3);border-radius:11px;padding:10px}.slot small{display:block;color:var(--mt);font-size:10px;margin-bottom:4px}.slot strong{font-size:12px}.stake{display:flex;gap:8px;margin-top:10px}.stake input{flex:1;background:var(--s3);border:1px solid var(--bd);border-radius:10px;padding:12px;color:var(--tx);font-size:15px;font-weight:800;outline:0}.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer}.bet{background:var(--g);color:#001}.cash{background:var(--yl);color:#111}.btn:disabled{opacity:.45;cursor:not-allowed}.notice{margin-top:10px;text-align:center;font-size:11px;color:var(--mt);min-height:16px}.bnav{position:fixed;bottom:0;left:0;right:0;height:56px;z-index:20;background:var(--hdr);border-top:1px solid var(--bd);display:flex}.bni{flex:1;text-align:center;padding-top:18px;font-size:9px;font-weight:800;color:var(--mt);text-transform:uppercase;cursor:pointer}.bni.on{color:var(--g)}
</style>
</head>
<body>
<header><a class="back" href="/">←</a><div class="logo">Safari<span>Bet</span> Casino</div><div class="bal" id="balance">KES —</div></header>
<main><section class="hero"><h1>🎰 JuanAI Casino</h1><p>Games are supplied by JuanAI. Each game shows its current play mode.</p></section><div class="section">JuanAI Games</div><div id="grid" class="grid"></div><div id="message" class="msg">Loading JuanAI casino games…</div></main>
<div id="screen" class="screen"><div class="top"><span class="close" onclick="closeGame()">←</span><div id="gameTitle" class="title"></div><div id="screenBalance" class="screenbal">KES —</div></div><div class="game"><div class="round"><div id="gameName" class="game-name">JuanAI</div><div id="mult" class="mult">1.00x</div><div id="stateText" class="status">Waiting for round…</div><div id="history" class="history"></div></div><div class="controls"><div class="slots"><div class="slot"><small>Bet 1</small><strong id="bet1">No active bet</strong></div><div class="slot"><small>Bet 2</small><strong id="bet2">No active bet</strong></div></div><div class="stake"><input id="stake" type="number" min="1" max="50000" step="1" value="10" inputmode="decimal"><button class="btn bet" id="betBtn" onclick="placeBet()">Place Bet</button><button class="btn cash" id="cashBtn" onclick="cashOut()" disabled>Cash Out</button></div><div id="notice" class="notice"></div></div></div></div>
<div id="launching" style="display:none;position:fixed;inset:0;z-index:80;background:rgba(6,10,6,.96);flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center">
  <div id="launchSpin" style="width:44px;height:44px;border:4px solid rgba(0,200,83,.2);border-top-color:#00c853;border-radius:50%;animation:sbspin 0.9s linear infinite"></div>
  <div id="launchText" style="font:800 20px Rajdhani,sans-serif;color:#e8f5e9"></div>
  <div id="launchSub" style="font-size:13px;color:#789078;max-width:300px"></div>
  <div style="display:flex;gap:10px;margin-top:6px">
    <button id="launchRetry" class="retry" style="display:none" onclick="hideLaunch();openGame(lastGameId)">Try again</button>
    <button id="launchClose" class="retry" style="display:none;background:transparent;color:#789078;border:1px solid rgba(0,200,83,.2)" onclick="hideLaunch()">Close</button>
  </div>
</div>
<style>@keyframes sbspin{to{transform:rotate(360deg)}}</style>
<nav class="bnav"><div class="bni" onclick="SB.go('/')">Home</div><div class="bni" onclick="SB.go('/my-bets')">My Bets</div><div class="bni on">Casino</div><div class="bni" onclick="SB.go('/account')">Account</div></nav>
<script type="text/sb-page">
const token=localStorage.getItem('token'); if(!token) SB.go('/login');
const headers=()=>({Authorization:'Bearer '+token,'Content-Type':'application/json'});

// Always render the two JuanAI real-money games immediately. The API refreshes
// their artwork/details in the background, so a cold JuanAI server can never
// leave the casino page empty.
const FALLBACK_GAMES=[
  {gameId:'aviator',name:'Aviator',category:'crash',thumbnail:'/casino/assets/aviator-thumb.png',source:'juanai',launchMode:'real-money',realMoney:true,status:'active'},
  {gameId:'jetx',name:'JetX',category:'crash',thumbnail:'/casino/assets/jetx-thumb.png',source:'juanai',launchMode:'real-money',realMoney:true,status:'active'}
];
let games=FALLBACK_GAMES.slice();
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function api(url,opt={}){const r=await fetch(url,Object.assign({headers:headers(),cache:'no-store'},opt));let d={};try{d=await r.json()}catch(_){}if(!r.ok){const e=new Error(d.message||'Request failed');e.retryable=!!d.retryable||r.status===503;throw e;}return d;}
async function loadBalance(){try{const d=await api('/api/casino/juanai/balance');if(d.success)document.getElementById('balance').textContent='KES '+Number(d.balance).toFixed(2)}catch(_){} }
function normalizeGames(list){
  const seen=new Set();
  return (Array.isArray(list)?list:[]).filter(g=>g&&g.gameId).map(g=>({
    ...g,
    gameId:String(g.gameId).trim().toLowerCase(),
    name:String(g.name||g.gameId),
    source:g.source||'juanai',
    launchMode:g.launchMode||'real-money',
    realMoney:g.realMoney!==false,
    thumbnail:g.thumbnail||g.image||null
  })).filter(g=>{
    if(seen.has(g.gameId))return false; seen.add(g.gameId); return true;
  });
}
function renderGames(list){
  const grid=document.getElementById('grid'),msg=document.getElementById('message');
  games=normalizeGames(list);
  if(!games.length) games=FALLBACK_GAMES.slice();
  grid.innerHTML=games.map(g=>{
    const image=g.thumbnail||g.image;
    const imageHtml=image?`<img src="${esc(image)}" alt="${esc(g.name)}" loading="eager" onerror="this.style.display='none';this.parentNode.classList.add('noimg')">`:'';
    const fallback=g.gameId==='aviator'?'✈️':g.gameId==='jetx'?'🚀':'🎰';
    const isReal=g.realMoney===true && g.launchMode==='real-money';
    const label=isReal?'REAL MONEY':'AVAILABLE';
    return `<div class="card" data-id="${esc(g.gameId)}" role="button" tabindex="0"><div class="art">${imageHtml}<span class="fallback">${fallback}</span></div><div class="body"><div class="name">${esc(g.name)}</div><div class="meta">JuanAI · ${esc(g.category||'crash')}</div><span class="tag">${label}</span></div></div>`;
  }).join('');
  msg.style.display='none';
}
function showLoadStatus(text){
  const msg=document.getElementById('message');
  msg.textContent=text; msg.style.display='block'; msg.style.padding='10px 18px'; msg.style.fontSize='11px';
}
async function loadGames(){
  // The fallback cards are already visible. Use any previously saved catalogue
  // if available, then refresh from JuanAI without blocking the lobby.
  try{
    const c=JSON.parse(localStorage.getItem('sb_casino_games')||'null');
    if(c&&Array.isArray(c.data)&&c.data.length) renderGames(c.data);
  }catch(_){}
  fetch('/api/casino/juanai/status',{headers:headers(),cache:'no-store'}).catch(()=>{});
  try{
    const d=await api('/api/casino/juanai/games');
    const fresh=normalizeGames(d.data||[]);
    if(fresh.length){
      try{localStorage.setItem('sb_casino_games',JSON.stringify({ts:Date.now(),data:fresh}));}catch(_){}
      renderGames(fresh);
    }
  }catch(e){
    // Never blank the lobby because JuanAI is waking up. Keep Aviator + JetX visible.
    showLoadStatus('Aviator and JetX are ready. Game server is connecting…');
    setTimeout(()=>{ const m=document.getElementById('message'); if(m)m.style.display='none'; },3500);
  }
}
let launching=false, launchTimer=null;
function showLaunch(text,sub,showRetry){
  const o=document.getElementById('launching');
  o.style.display='flex';
  document.getElementById('launchText').textContent=text;
  document.getElementById('launchSub').textContent=sub||'';
  document.getElementById('launchSpin').style.display=showRetry?'none':'block';
  document.getElementById('launchRetry').style.display=showRetry?'inline-block':'none';
  document.getElementById('launchClose').style.display=showRetry?'inline-block':'none';
}
function hideLaunch(){document.getElementById('launching').style.display='none';if(launchTimer){clearInterval(launchTimer);launchTimer=null;}}
let lastGameId=null;
async function openGame(id){
  if(launching)return;
  const g=games.find(x=>x.gameId===id); if(!g)return;
  lastGameId=id; launching=true;
  let secs=0;
  showLaunch('Starting '+g.name+'...','Connecting to JuanAI game server',false);
  launchTimer=setInterval(()=>{secs++;document.getElementById('launchSub').textContent=secs<8?'Connecting to JuanAI game server':'JuanAI is waking up - this can take up to 30 seconds the first time ('+secs+'s)';},1000);
  const ctl=new AbortController(); const abort=setTimeout(()=>ctl.abort(),130000);
  try{
    let d=null;
    for(let attempt=0;attempt<2;attempt++){
      try{
        d=await api('/api/casino/juanai/launch',{method:'POST',body:JSON.stringify({gameId:id}),signal:ctl.signal});
        break;
      }catch(e){
        if(!e.retryable||attempt===1)throw e;
        await new Promise(r=>setTimeout(r,3000));
      }
    }
    if(!d||!d.success||!d.launchUrl)throw new Error('JuanAI did not return a playable game URL.');
    showLaunch('Opening '+g.name+'...','',false);
    window.location.href=d.launchUrl;
  }catch(e){
    const aborted=e&&e.name==='AbortError';
    showLaunch('Could not start the game',aborted?'JuanAI did not answer in time. Please try again.':(e&&e.message)||'Please try again.',true);
  }finally{
    clearTimeout(abort); if(launchTimer){clearInterval(launchTimer);launchTimer=null;} launching=false;
  }
}
const grid=document.getElementById('grid');
grid.addEventListener('click',e=>{const c=e.target.closest('[data-id]');if(c)openGame(c.dataset.id)});
grid.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const c=e.target.closest('[data-id]');if(c){e.preventDefault();openGame(c.dataset.id)}}});

// Render before any network request — this is the important fast-path.
renderGames(FALLBACK_GAMES);
loadBalance();
loadGames();
setInterval(loadBalance,5000);
</script><script>SB.run()</script>
</body></html>
