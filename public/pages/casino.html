<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Casino – SafariBet</title>
<script src="/js/theme.js"></script>
<script src="/js/router.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<style>
:root{--g:#00c853;--bg:#0a0e0a;--s2:#182018;--s3:#1e271e;--bd:rgba(0,200,83,.12);--tx:#e8f5e9;--mt:#789078;--yl:#ffd600;--rd:#ff4b4b;--hdr:rgba(8,12,8,.98)}
html[data-theme="light"]{--bg:#f4f7f4;--s2:#eef3ee;--s3:#e4ece4;--tx:#14231a;--mt:#5c7a63;--hdr:rgba(255,255,255,.98)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:Inter,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
header{height:54px;position:fixed;top:0;left:0;right:0;z-index:20;background:var(--hdr);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:10px}.back{color:var(--g);text-decoration:none;font-size:22px}.logo{font:800 21px Rajdhani;color:var(--g)}.logo span{color:var(--yl)}.bal{margin-left:auto;padding:6px 10px;border:1px solid var(--bd);border-radius:9px;color:var(--g);font-size:13px;font-weight:800;background:var(--s2)}
main{padding:54px 0 70px}.hero{padding:24px 16px;background:linear-gradient(135deg,#003d1a,#061006);border-bottom:1px solid var(--bd)}.hero h1{font:800 29px Rajdhani}.hero p{font-size:12px;color:var(--mt);margin-top:4px}.section{padding:16px 12px 8px;font-size:11px;font-weight:800;color:var(--mt);text-transform:uppercase;letter-spacing:.8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px}.card{background:var(--s2);border:1px solid var(--bd);border-radius:15px;overflow:hidden;cursor:pointer}.art{height:120px;display:flex;align-items:center;justify-content:center;font-size:58px;background:radial-gradient(circle at 50% 30%,#154d27,#0b120b)}.body{padding:11px}.name{font-size:14px;font-weight:800}.meta{font-size:11px;color:var(--mt);margin-top:3px}.tag{display:inline-block;margin-top:8px;padding:3px 7px;border-radius:999px;border:1px solid rgba(0,200,83,.2);color:var(--g);font-size:9px;font-weight:800;text-transform:uppercase}.msg{padding:36px 18px;text-align:center;color:var(--mt);font-size:13px}.retry{margin-top:12px;border:0;border-radius:9px;padding:10px 18px;background:var(--g);font-weight:800;cursor:pointer}
.screen{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);flex-direction:column}.screen.on{display:flex}.top{height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--hdr);border-bottom:1px solid var(--bd)}.close{font-size:23px;color:var(--g);cursor:pointer}.title{flex:1;font-weight:800}.screenbal{font-size:12px;font-weight:800;color:var(--g)}.game{flex:1;overflow:auto;padding:14px}.round{background:var(--s2);border:1px solid var(--bd);border-radius:16px;padding:18px;text-align:center}.game-name{font-size:11px;color:var(--mt);text-transform:uppercase;font-weight:800;letter-spacing:.8px}.mult{font:800 64px Rajdhani;margin:20px 0 5px;color:var(--g)}.status{font-size:12px;color:var(--mt);min-height:18px}.history{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}.h{font-size:10px;font-weight:800;padding:5px 7px;border-radius:7px;background:var(--s3)}.controls{margin-top:12px;background:var(--s2);border:1px solid var(--bd);border-radius:16px;padding:14px}.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slot{border:1px solid var(--bd);background:var(--s3);border-radius:11px;padding:10px}.slot small{display:block;color:var(--mt);font-size:10px;margin-bottom:4px}.slot strong{font-size:12px}.stake{display:flex;gap:8px;margin-top:10px}.stake input{flex:1;background:var(--s3);border:1px solid var(--bd);border-radius:10px;padding:12px;color:var(--tx);font-size:15px;font-weight:800;outline:0}.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer}.bet{background:var(--g);color:#001}.cash{background:var(--yl);color:#111}.btn:disabled{opacity:.45;cursor:not-allowed}.notice{margin-top:10px;text-align:center;font-size:11px;color:var(--mt);min-height:16px}.bnav{position:fixed;bottom:0;left:0;right:0;height:56px;z-index:20;background:var(--hdr);border-top:1px solid var(--bd);display:flex}.bni{flex:1;text-align:center;padding-top:18px;font-size:9px;font-weight:800;color:var(--mt);text-transform:uppercase;cursor:pointer}.bni.on{color:var(--g)}
</style>
</head>
<body>
<header><a class="back" href="/">←</a><div class="logo">Safari<span>Bet</span> Casino</div><div class="bal" id="balance">KES —</div></header>
<main><section class="hero"><h1>🎰 JuanAI Casino</h1><p>Games are supplied by JuanAI. Real-money bets use your SafariBet wallet.</p></section><div class="section">JuanAI Games</div><div id="grid" class="grid"></div><div id="message" class="msg">Loading JuanAI casino games…</div></main>
<div id="screen" class="screen"><div class="top"><span class="close" onclick="closeGame()">←</span><div id="gameTitle" class="title"></div><div id="screenBalance" class="screenbal">KES —</div></div><div class="game"><div class="round"><div id="gameName" class="game-name">JuanAI</div><div id="mult" class="mult">1.00x</div><div id="stateText" class="status">Waiting for round…</div><div id="history" class="history"></div></div><div class="controls"><div class="slots"><div class="slot"><small>Bet 1</small><strong id="bet1">No active bet</strong></div><div class="slot"><small>Bet 2</small><strong id="bet2">No active bet</strong></div></div><div class="stake"><input id="stake" type="number" min="1" max="50000" step="1" value="10" inputmode="decimal"><button class="btn bet" id="betBtn" onclick="placeBet()">Place Bet</button><button class="btn cash" id="cashBtn" onclick="cashOut()" disabled>Cash Out</button></div><div id="notice" class="notice"></div></div></div></div>
<nav class="bnav"><div class="bni" onclick="SB.go('/')">Home</div><div class="bni" onclick="SB.go('/my-bets')">My Bets</div><div class="bni on">Casino</div><div class="bni" onclick="SB.go('/account')">Account</div></nav>
<script type="text/sb-page">
const token=localStorage.getItem('token'); if(!token) SB.go('/login');
const headers=()=>({Authorization:'Bearer '+token,'Content-Type':'application/json'});
let games=[], currentGame=null, stateTimer=null, betTimer=null, activeBet=null;
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function api(url,opt={}){const r=await fetch(url,Object.assign({headers:headers(),cache:'no-store'},opt));let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw new Error(d.message||'Request failed');return d;}
async function loadBalance(){try{const d=await api('/api/casino/juanai/balance');if(d.success){document.getElementById('balance').textContent='KES '+Number(d.balance).toFixed(2);document.getElementById('screenBalance').textContent='KES '+Number(d.balance).toFixed(2)}}catch(_){} }
async function loadGames(){const grid=document.getElementById('grid'),msg=document.getElementById('message');try{const d=await api('/api/casino/juanai/games');games=(d.data||[]).filter(g=>g && g.realMoney===true);grid.innerHTML=games.map(g=>{const own=true;const badge='REAL MONEY';const art=g.thumbnail?`<img src="${esc(g.thumbnail)}" alt="" loading="lazy">`:(g.gameId==='aviator'?'✈️':g.gameId==='jetx'?'🚀':'🎰');return `<div class="card" data-id="${esc(g.gameId)}"><div class="art">${art}</div><div class="body"><div class="name">${esc(g.name)}</div><div class="meta">${own?'JuanAI':'AS Tech'} · ${esc(g.category)}${g.providerCode?' · '+esc(g.providerCode):''}</div><span class="tag">${badge}</span></div></div>`}).join('');msg.style.display=games.length?'none':'block';if(!games.length)msg.textContent='No JuanAI real-money casino games are available right now.';grid.querySelectorAll('.card').forEach(card=>card.addEventListener('click',()=>openGame(card.dataset.id)));}catch(e){msg.innerHTML='Could not load JuanAI casino games.<br><button class="retry" onclick="loadGames()">Retry</button>';}}
document.getElementById('grid').addEventListener('click',e=>{const c=e.target.closest('[data-id]');if(c)openGame(c.dataset.id)});
async function openGame(id){const g=games.find(x=>x.gameId===id);if(!g)return;if(!g.realMoney){notice('This JuanAI game is not available for real-money play.');return;}if(!['aviator','jetx'].includes(id)){notice('This JuanAI game is not available for real-money play.');return;}currentGame=id;document.getElementById('gameTitle').textContent=g?.name||id;document.getElementById('gameName').textContent=(g?.name||id)+' · JuanAI';document.getElementById('screen').classList.add('on');activeBet=null;renderBets();clearInterval(stateTimer);clearInterval(betTimer);pollState();stateTimer=setInterval(pollState,750);loadBalance();}
function closeGame(){document.getElementById('screen').classList.remove('on');clearInterval(stateTimer);clearInterval(betTimer);currentGame=null;activeBet=null;loadBalance();}
function multiplier(s){if(s.status==='flying'){return Math.min(Math.exp(0.09*Number(s.elapsedMs||0)/1000),50)}if(s.status==='crashed')return Number(s.crashPoint||1);return 1;}
async function pollState(){if(!currentGame)return;try{const d=await api('/api/casino/juanai/state/'+encodeURIComponent(currentGame));if(!d.success)throw new Error(d.message||'Game state unavailable');const s=d.data?.data||d.data||{};const m=multiplier(s);document.getElementById('mult').textContent=m.toFixed(2)+'x';document.getElementById('stateText').textContent=s.status==='waiting'?`Next round in ${s.waitSeconds||0}s`:s.status==='flying'?'Flying…':'Crashed at '+Number(s.crashPoint||m).toFixed(2)+'x';document.getElementById('history').innerHTML=(s.history||[]).slice(0,12).map(x=>`<span class="h">${Number(x).toFixed(2)}x</span>`).join('');if(activeBet)pollBet();}catch(e){document.getElementById('stateText').textContent=e.message||'Game state unavailable';} }
async function placeBet(){if(!currentGame||activeBet)return;const stake=Number(document.getElementById('stake').value);if(!Number.isFinite(stake)||stake<1||stake>50000){notice('Stake must be between KES 1 and KES 50,000.');return}document.getElementById('betBtn').disabled=true;try{const d=await api('/api/casino/juanai/bet',{method:'POST',body:JSON.stringify({gameId:currentGame,slot:1,stake})});if(!d.success)throw new Error(d.message||'Bet could not be placed');activeBet={betId:d.betId,stake,slot:1};notice('Bet placed for the current JuanAI round.');pollBet();clearInterval(betTimer);betTimer=setInterval(pollBet,500);loadBalance();}catch(e){notice(e.message)}finally{document.getElementById('betBtn').disabled=false;}}
async function pollBet(){if(!activeBet)return;try{const d=await api('/api/casino/juanai/bet/'+encodeURIComponent(activeBet.betId));if(!d.success)return;const b=d.data;if(b.status==='pending'){document.getElementById('cashBtn').disabled=false;document.getElementById('cashBtn').textContent='Cash Out';}else{document.getElementById('cashBtn').disabled=true;notice(b.status==='won'?`Won ${Number(b.won||0).toFixed(2)} KES at ${Number(b.multiplier||0).toFixed(2)}x.`:'Bet lost.');activeBet=null;clearInterval(betTimer);loadBalance();}renderBets(b); }catch(_){} }
async function cashOut(){if(!activeBet)return;document.getElementById('cashBtn').disabled=true;try{const d=await api('/api/casino/juanai/bet/'+encodeURIComponent(activeBet.betId)+'/cashout',{method:'POST'});if(!d.success)throw new Error(d.message||'Cash out was not accepted');notice(`Cashed out at ${Number(d.data?.multiplier||0).toFixed(2)}x.`);pollBet();loadBalance();}catch(e){notice(e.message);document.getElementById('cashBtn').disabled=false}}
function renderBets(b){document.getElementById('bet1').textContent=activeBet?(b?.status==='pending'?`KES ${activeBet.stake} · live`:`KES ${activeBet.stake} · ${b?.status||'active'}`):'No active bet';document.getElementById('bet2').textContent='No active bet'}
function notice(t){document.getElementById('notice').textContent=t||''}
loadBalance();loadGames();setInterval(loadBalance,15000);
</script><script>SB.run()</script>
</body></html>
