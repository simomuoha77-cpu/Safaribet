<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Virtual Games – SafariBet</title>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png"/>
<link rel="shortcut icon" href="/favicon.ico"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#00c853"/>
<meta name="description" content="Virtual sports and games on SafariBet - always on, results in minutes." data-sb-page-head/>
<link rel="canonical" href="https://safaribet.top/virtual" data-sb-page-head/>
<meta property="og:site_name" content="SafariBet" data-sb-page-head/>
<meta property="og:image" content="https://safaribet.top/logo.png" data-sb-page-head/>
<script src="/js/theme.js"></script>
<script src="/js/router.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<style>
:root{--g:#00c853;--bg:#0a0e0a;--s2:#182018;--s3:#1e271e;--bd:rgba(0,200,83,.12);--tx:#e8f5e9;--mt:#789078;--yl:#ffd600;--pu:#a050ff;--hdr:rgba(8,12,8,.98)}
html[data-theme="light"]{--bg:#f4f7f4;--s2:#eef3ee;--s3:#e4ece4;--tx:#14231a;--mt:#5c7a63;--hdr:rgba(255,255,255,.98)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
header{height:54px;position:fixed;top:0;left:0;right:0;z-index:20;background:var(--hdr);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:10px}
.back{color:var(--g);text-decoration:none;font-size:22px}.logo{font:800 21px Rajdhani;color:var(--g)}.logo span{color:var(--yl)}
main{padding:54px 0 74px}
.hero{padding:20px 16px 6px}.hero h1{font:800 28px Rajdhani}.hero p{font-size:13px;color:var(--mt);margin-top:4px}
.chips{display:flex;gap:8px;padding:14px 12px 4px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:9px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--s2);color:var(--mt);font-size:13px;font-weight:700;cursor:pointer}
.chip.on{background:var(--pu);border-color:var(--pu);color:#fff}
.count{padding:12px 16px 8px;font-size:13px;color:var(--mt)}.count b{color:var(--pu)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 12px}
.card{cursor:pointer;min-width:0}
.art{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#2a1a4d,#0b120b);border:1px solid var(--bd)}
.art img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .2s}.art img.ok{opacity:1}
.art .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px}
.badge{position:absolute;top:6px;left:6px;padding:2px 7px;border-radius:7px;font-size:9px;font-weight:800;background:#ff8a00;color:#fff;z-index:2}
.badge.new{background:var(--g);color:#001}
.card:active .art{transform:scale(.97)}
.nm{font-size:12px;font-weight:700;margin-top:6px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pv{font-size:10px;color:var(--mt);margin-top:2px}
.msg{padding:40px 18px;text-align:center;color:var(--mt);font-size:13px}
.retry{margin-top:12px;border:0;border-radius:9px;padding:10px 18px;background:var(--g);font-weight:800;cursor:pointer}
.sk{aspect-ratio:1/1;border-radius:14px;background:linear-gradient(90deg,var(--s2),var(--s3),var(--s2));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:16px;right:16px;bottom:78px;z-index:60;background:var(--s3);border:1px solid var(--bd);border-radius:12px;padding:13px 14px;font-size:13px;text-align:center;display:none}
.bnav{position:fixed;bottom:0;left:0;right:0;height:56px;z-index:20;background:var(--hdr);border-top:1px solid var(--bd);display:flex}.bni{flex:1;text-align:center;padding-top:18px;font-size:9px;font-weight:800;color:var(--mt);text-transform:uppercase;cursor:pointer}.bni.on{color:var(--g)}
</style>
</head>
<body>
<header><a class="back" href="/" onclick="SB.go('/');return false">←</a><div class="logo">Safari<span>Bet</span> Virtual</div></header>
<main>
  <section class="hero"><h1>Virtual</h1><p>Virtual sports and games — always on, results in minutes.</p></section>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg" style="display:none"></div>
</main>
<div class="toast" id="toast"></div>
<nav class="bnav"><div class="bni" onclick="SB.go('/')">Home</div><div class="bni" onclick="SB.go('/my-bets')">My Bets</div><div class="bni" onclick="SB.go('/casino')">Casino</div><div class="bni" onclick="SB.go('/account')">Account</div></nav>
<script type="text/sb-page">
(function(){
  var all = [], filter = 'All';
  var KEY = 'sb_virtual_games';
  var gridEl = document.getElementById('grid'), chipsEl = document.getElementById('chips'), countEl = document.getElementById('count'), msgEl = document.getElementById('msg');
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]});}
  function skeleton(){ gridEl.innerHTML = new Array(9).fill('<div><div class="sk"></div></div>').join(''); }
  function render(){
    var provs = ['All'];
    all.forEach(function(g){ if (provs.indexOf(g.provider) < 0) provs.push(g.provider); });
    chipsEl.innerHTML = provs.map(function(p){ return '<div class="chip'+(p===filter?' on':'')+'" data-p="'+esc(p)+'">'+(p==='All'?'🎮 ':'🏆 ')+esc(p)+'</div>'; }).join('');
    var list = all.filter(function(g){ return filter==='All' || g.provider===filter; });
    countEl.innerHTML = list.length ? 'Showing <b>'+list.length+'</b> games' : '';
    gridEl.innerHTML = list.map(function(g){
      return '<div class="card" data-id="'+esc(g.id)+'"><div class="art">'
        + (g.hot?'<span class="badge">🔥 HOT</span>':(g.isNew?'<span class="badge new">NEW</span>':''))
        + '<div class="fb">🎮</div>'
        + (g.image?'<img loading="lazy" decoding="async" src="'+esc(g.image)+'" alt="'+esc(g.name)+'" onload="this.classList.add(\'ok\')" onerror="this.remove()">':'')
        + '</div><div class="nm">'+esc(g.name)+'</div><div class="pv">'+esc(g.provider)+'</div></div>';
    }).join('');
    msgEl.style.display = list.length ? 'none' : 'block';
    if (!list.length) msgEl.innerHTML = 'No virtual games available right now.<br><button class="retry" id="retryBtn">Refresh</button>';
  }
  function setGames(list){ if (Array.isArray(list) && list.length) { all = list; render(); return true; } return false; }

  chipsEl.addEventListener('click', function(e){ var c = e.target.closest('.chip'); if (!c) return; filter = c.getAttribute('data-p'); render(); });
  gridEl.addEventListener('click', function(e){ var c = e.target.closest('.card'); if (c) openGame(c.getAttribute('data-id')); });
  msgEl.addEventListener('click', function(e){ if (e.target.id==='retryBtn') load(true); });

  var toastT;
  function toast(t){ var el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(function(){ el.style.display='none'; }, 3200); }
  function openGame(id){
    var tok = localStorage.getItem('token');
    if (!tok) { SB.go('/login'); return; }
    fetch('/api/virtual/launch/'+encodeURIComponent(id), { headers: { Authorization: 'Bearer '+tok }, cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.success && d.url) location.href = d.url; else toast((d && d.message) || 'This game is coming soon.'); })
      .catch(function(){ toast('Could not open the game. Try again.'); });
  }

  function load(force){
    // 1) instant: last list from this phone
    var had = false;
    try { var c = JSON.parse(localStorage.getItem(KEY)||'null'); if (c && c.data && c.data.length) had = setGames(c.data); } catch(e){}
    if (!had) skeleton();
    // 2) fresh from the server (served from its memory)
    var ctrl = new AbortController(); var t = setTimeout(function(){ ctrl.abort(); }, 9000);
    fetch('/api/virtual/games', { signal: ctrl.signal }).then(function(r){ return r.json(); }).then(function(d){
      clearTimeout(t);
      if (d && d.success && d.data && d.data.length) { setGames(d.data); try { localStorage.setItem(KEY, JSON.stringify({ts:Date.now(), data:d.data})); } catch(e){} }
      else if (!had) { all = []; render(); if (d && d.pending) setTimeout(function(){ load(); }, 4000); }
    }).catch(function(){ clearTimeout(t); if (!had) { all = []; render(); } });
  }
  load();
})();
</script>
<script>SB.run()</script>
</body>
</html>
