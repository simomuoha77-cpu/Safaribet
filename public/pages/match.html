<html lang="en">

<style>
:root{--g:#00c853;--bg:#0a0e0a;--s1:#111711;--s2:#182018;--s3:#1e271e;--bd:rgba(0,200,83,0.1);--tx:#e8f5e9;--mt:#6a8a6a;--yl:#ffd600;--rd:#ff3b3b}
html[data-theme="light"]{--g:#00a844;--bg:#f4f7f4;--s1:#ffffff;--s2:#eef3ee;--s3:#e4ece4;--bd:rgba(0,140,58,0.18);--tx:#14231a;--mt:#5c7a63;--yl:#b8860b;--rd:#d32f2f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:90px;transition:background 0.2s,color 0.2s}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--s1);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10}
.back{font-size:20px;color:var(--tx);background:none;border:none;cursor:pointer;padding:4px}
.topbar-ttl{font-size:13px;color:var(--mt);flex:1}

.mh{padding:18px 16px;background:var(--s1);border-bottom:1px solid var(--bd)}
.mh-teams{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mh-team{flex:1;text-align:center;font-weight:700;font-size:15px}
.mh-mid{text-align:center;min-width:70px}
.mh-score{font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;color:var(--g)}
.mh-vs{font-size:12px;color:var(--mt);font-weight:700}
.mh-status{text-align:center;font-size:11px;margin-top:6px;color:var(--mt)}
.mh-status.live{color:var(--rd);font-weight:700}
.mh-league{text-align:center;font-size:11px;color:var(--mt);margin-top:8px;text-transform:uppercase;letter-spacing:0.5px}

.main{padding:12px}
.market-card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;margin-bottom:12px;overflow:hidden}
.market-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--s2)}
.suspended-tag{font-size:10px;background:rgba(255,59,59,0.15);color:var(--rd);padding:2px 7px;border-radius:6px;font-weight:700;letter-spacing:0.3px}
.suspended-note{padding:12px 14px;font-size:11px;color:var(--mt);line-height:1.5;background:rgba(255,59,59,0.03)}
.odd-btn.boosted{border-color:var(--yl);position:relative}
.boost-flag{position:absolute;top:-8px;left:6px;background:var(--yl);color:#2a2000;font-size:9px;font-weight:800;padding:1px 5px;border-radius:5px}
.odd-val-old{font-size:11px;color:var(--mt);text-decoration:line-through}
.boosted-val{color:var(--yl)!important}
.boost-note{margin:0 12px 12px;padding:8px 10px;background:rgba(255,214,0,0.06);border:1px solid rgba(255,214,0,0.2);border-radius:8px;font-size:10px;color:var(--mt);line-height:1.4}
.market-name{font-weight:700;font-size:14px}
.synth-tag{font-size:10px;background:rgba(255,214,0,0.15);color:var(--yl);padding:2px 7px;border-radius:6px;font-weight:700;letter-spacing:0.3px}
.market-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;padding:12px 14px}
.odd-btn{background:var(--s2);border:1.5px solid var(--bd);border-radius:8px;padding:10px 6px;text-align:center;cursor:pointer;transition:all 0.15s}
.odd-btn:active{transform:scale(0.96)}
.odd-btn.sel{background:var(--g);border-color:var(--g)}
.odd-btn.sel .odd-lbl,.odd-btn.sel .odd-val{color:#04140a}
.odd-lbl{font-size:11px;color:var(--mt);margin-bottom:3px;line-height:1.2}
.odd-val{font-size:15px;font-weight:800;color:var(--g)}
.odd-btn.sel .odd-val{color:#04140a}

.synth-note{margin:0 12px 14px;padding:10px 12px;background:rgba(255,214,0,0.06);border:1px solid rgba(255,214,0,0.2);border-radius:10px;font-size:11px;color:var(--mt);line-height:1.5}

.loading{text-align:center;padding:60px 20px;color:var(--mt);font-size:13px}

.slip-bar{position:fixed;bottom:0;left:0;right:0;background:var(--g);color:#04140a;padding:14px 16px;display:none;align-items:center;justify-content:space-between;font-weight:700;cursor:pointer;z-index:20}

.mode-toggle{display:flex;gap:8px;padding:10px 12px;background:var(--s1);border-bottom:1px solid var(--bd)}
.mode-btn{flex:1;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--s2);color:var(--mt);font-weight:700;font-size:12px;cursor:pointer}
.mode-btn.active{background:var(--g);color:#04140a;border-color:var(--g)}

.builder-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-top:1px solid var(--bd);padding:12px 16px;z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,0.3)}
.builder-bar-top{display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:6px}
.builder-note{font-size:10px;color:var(--mt);line-height:1.4;margin-bottom:10px}
.field-row{display:flex;gap:8px}
.field-row input{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:10px;color:var(--tx);font-size:13px}
.builder-place-btn{background:var(--g);color:#04140a;border:none;border-radius:8px;padding:10px 18px;font-weight:800;font-size:13px;cursor:pointer}
.res{margin-top:8px;font-size:12px;text-align:center}
.res.ok{color:var(--g)}
.res.er{color:var(--rd)}
  .mkt-closed{opacity:.45;pointer-events:none}
  .odds-flash .odd-val{animation:oddsflash 1.1s ease}
  @keyframes oddsflash{0%{background:rgba(255,200,0,.45)}100%{background:transparent}}
</style>
</head>
<body>

<div class="topbar">
  <button class="back" onclick="history.back()">←</button>
  <div class="topbar-ttl" id="topLeague">Loading…</div>
</div>

<div class="mh" id="matchHeader">
  <div class="loading">Loading match…</div>
</div>

<div class="mode-toggle" id="modeToggle" style="display:none">
  <button class="mode-btn active" id="modeBtnSlip" onclick="setMode('slip')">Quick Pick</button>
  <button class="mode-btn" id="modeBtnBuilder" onclick="setMode('builder')">🧩 Bet Builder</button>
</div>

<div class="main" id="marketsContainer"></div>

<div class="slip-bar" id="slipBar" onclick="SB.go('/?openSlip=1')">
  <span id="slipCount">0 selections</span>
  <span id="slipOdds">View Slip on Home →</span>
</div>

<div class="builder-bar" id="builderBar">
  <div class="builder-bar-top">
    <span id="builderLegCount">0 markets selected</span>
    <span id="builderOdds">Odds: —</span>
  </div>
  <div class="builder-note">Combines multiple markets on THIS match into one bet. Odds are adjusted down from simple multiplication since these outcomes aren't fully independent — standard practice for same-match combo bets.</div>
  <div class="field-row">
    <input type="number" id="builderStake" placeholder="Stake (KES min. 10)" min="10"/>
    <button class="builder-place-btn" onclick="placeBetBuilder()">Place Bet</button>
  </div>
  <div class="res" id="builderRes"></div>
</div>

<script type="text/sb-page">
// Prefer sessionStorage (keeps the URL clean, no vendor-identifying matchId
// visible in the address bar) — fall back to the old ?id= query string only
// for backward compatibility with any links already shared before this change.
const urlMatchId = new URLSearchParams(location.search).get('id');
const matchId = urlMatchId || sessionStorage.getItem('currentMatchId');
let matchData = null;
let slip = JSON.parse(localStorage.getItem('betslip') || '[]');

if (!matchId) {
  document.getElementById('matchHeader').innerHTML = '<div class="loading">No match specified. <a href="/" style="color:var(--g)">Go back home</a></div>';
} else {
  // Clean up the URL if we got here via the old query-string method
  if (location.search.includes('id=')) history.replaceState(null, '', '/match');
  loadMatch();
}

// Turn whatever we already knew about this match on the previous page (team
// names, league, current 1X2 odds, status/score) into the same shape the
// markets renderer expects, so there's something real to paint before the
// network has answered at all.
function summaryToMatchData(s){
  const hasOdds = s.odds && (s.odds.home != null || s.odds.draw != null || s.odds.away != null);
  const options = hasOdds ? [
    { pick: 'home', pickLabel: s.homeTeam, odds: Number(s.odds.home) },
    ...(s.odds.draw != null ? [{ pick: 'draw', pickLabel: 'Draw', odds: Number(s.odds.draw) }] : []),
    { pick: 'away', pickLabel: s.awayTeam, odds: Number(s.odds.away) }
  ].filter(o => Number.isFinite(o.odds)) : [];
  // Only worth showing as its own market card if there are at least 2 real
  // priced outcomes — a single stray option looked exactly like a broken,
  // half-rendered card, which is worse than just showing the loading state
  // below until the real data (with all outcomes) arrives moments later.
  const legacyMarket = options.length >= 2 ? [{
    market: '1x2',
    label: 'Match Result',
    providerMarket: false,
    isSynthetic: false,
    options
  }] : [];
  return {
    matchId: s.matchId,
    homeTeam: s.homeTeam,
    awayTeam: s.awayTeam,
    league: s.league,
    commenceTime: s.commenceTime,
    status: s.status,
    score: s.score || {},
    markets: (Array.isArray(s.markets) && s.markets.length) ? s.markets : legacyMarket
  };
}

// ── Timings (ms since this page started loading markets) ──
const __mmT0 = performance.now();
const mmTimings = window.__mmTimings = { start: 0 };
function mmMark(k){ if (mmTimings[k] == null) mmTimings[k] = Math.round(performance.now() - __mmT0); }
function mmReport(src, d){
  try {
    const st = d && d.timings ? d.timings : null;
    console.log('[markets-timing]', JSON.stringify({ client: mmTimings, server: st, src }));
  } catch(e) {}
}
// Newest-wins guard: a slow older response can never overwrite newer odds.
let lastFetchedAt = 0;
function isStaleResponse(d){
  const t = d && d.data && d.data.fetchedAt;
  if (!t) return false;
  if (t < lastFetchedAt) return true;
  lastFetchedAt = t;
  return false;
}

async function loadMatch(){
  // Instant paint: if we already know roughly what this match looks like
  // from the page the user just came from, render it immediately — no
  // network wait, no loading screen. The full SofaBets market catalogue is
  // then fetched below and merged in silently the moment it arrives.
  let paintedFromCache = false;
  try {
    const cachedRaw = sessionStorage.getItem('currentMatchSummary');
    if (cachedRaw && !matchData) {
      const cached = JSON.parse(cachedRaw);
      if (cached && String(cached.matchId) === String(matchId)) {
        matchData = summaryToMatchData(cached);
        renderHeader();
        renderMarkets(true); // true = this is the preliminary/instant paint, not the final answer yet
        updateSlipBar();
        mmMark('paintSummary');
        paintedFromCache = true;
      }
    }
  } catch (e) { /* corrupt cache — fall through to the normal network load */ }

  // Full market list seen recently (prefetched on touch, or from a previous
  // visit): paint it right away instead of waiting for the network at all.
  if (!matchData || !matchData.__full) {
    const full = (window.SB && SB.cachedMatch) ? SB.cachedMatch(matchId) : null;
    if (full && Array.isArray(full.markets) && full.markets.length) {
      matchData = full; matchData.__full = true;
      renderHeader(); renderMarkets(false); updateSlipBar();
      mmMark('paintCachedMarkets');
      paintedFromCache = true;
    }
  }

  try {
    // Re-uses a request already started by the touch/hover prefetch if there is one
    const d = (window.SB && SB.prefetchMatch) ? await SB.prefetchMatch(matchId)
      : await (await fetch(`/api/odds/match/${encodeURIComponent(matchId)}?rich=1`, { cache: 'no-store' })).json();
    mmMark('networkDone');
    if (d && d.pending) {            // server is still resolving this fixture — keep polling quietly
      pollFullMarkets();
      return;
    }
    if (!d.success) {
      // Only show the error state if we had nothing to show at all —
      // never blow away an already-painted cached view over a background
      // refresh hiccup.
      if (!paintedFromCache) {
        document.getElementById('matchHeader').innerHTML = '<div class="loading">Market is currently unavailable. Please try again.</div>';
      }
      return;
    }
    if (isStaleResponse(d)) return;
    matchData = d.data; matchData.__full = true;
    renderHeader();
    renderMarkets(false);
    updateSlipBar();
    mmMark('renderedMarkets');
    mmReport('initial', d.data);
    startMarketsRefresh();
    // Server answered fast with the basics; the full market list is still being
    // fetched upstream. Quietly pick it up the moment it is ready.
    if (d.data.marketsPending) pollFullMarkets();
  } catch(e) {
    if (!paintedFromCache) {
      document.getElementById('matchHeader').innerHTML = '<div class="loading">Market is currently unavailable. Please try again.</div>';
    }
  }
}

let _pollingMarkets = false;
async function pollFullMarkets(){
  if (_pollingMarkets) return;
  _pollingMarkets = true;
  try {
    for (let i = 0; i < 12; i++) {
      await new Promise(r => setTimeout(r, i < 4 ? 700 : 2000));
      try {
        const d = await (await fetch(`/api/odds/match/${encodeURIComponent(matchId)}?rich=1`, { cache: 'no-store' })).json();
        if (d && d.success && d.data && !isStaleResponse(d)) {
          matchData = d.data; matchData.__full = true;
          renderHeader(); renderMarkets(false); updateSlipBar();
          mmMark('renderedMarkets');
          if (!d.data.marketsPending) { mmReport('poll', d.data); startMarketsRefresh(); return; }
        }
      } catch (e) { /* keep trying */ }
    }
    if (!matchData || !(matchData.markets || []).length) {
      document.getElementById('marketsContainer').innerHTML = '<div class="loading">Markets are taking longer than usual. Pull to refresh to try again.</div>';
    }
  } finally { _pollingMarkets = false; }
}

// Half label for football: provider minute when it sends one, else time since kickoff.
function matchLivePeriod(m){
  const per = String(m.score?.period || '').toUpperCase();
  const notFb = /basket|tennis|cricket|rugby|volley|hockey|handball/i.test(String(m.sport || ''));
  if (notFb) return m.score?.minute!=null ? m.score.minute+"'" : '';
  if (per==='HT' || per==='PAUSED') return 'HT';
  const real = m.score?.minute!=null && !m.score?.minuteIsEstimated;
  if (real) return (m.score.minute<=45?'1H ':'2H ')+m.score.minute+"'";
  const el = m.commenceTime ? (Date.now()-new Date(m.commenceTime).getTime())/60000 : null;
  if (el==null || el<=0) return '';
  if (el<=47) return '1H ~'+Math.max(1,Math.round(el))+"'";
  if (el<=60) return el>=50 ? 'HT' : '1H 45+';
  return '2H ~'+Math.min(90,Math.max(46,Math.round(el-15)))+"'";
}
function renderHeader(){
  const m = matchData;
  document.getElementById('topLeague').textContent = m.league || 'Football';
  const isLive = m.status === 'live';
  const statusText = isLive
    ? `<span class="mh-status live">● LIVE ${matchLivePeriod(m)}</span>`
    : m.status === 'finished'
      ? `<span class="mh-status">Full Time</span>`
      : `<span class="mh-status">${new Date(m.commenceTime).toLocaleString([], {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}</span>`;

  document.getElementById('matchHeader').innerHTML = `
    <div class="mh-teams">
      <div class="mh-team">${m.homeTeam}</div>
      <div class="mh-mid">
        <div class="mh-score">${m.score?.home ?? '-'} : ${m.score?.away ?? '-'}</div>
      </div>
      <div class="mh-team">${m.awayTeam}</div>
    </div>
    ${statusText}
    <div class="mh-league">${m.league || ''}</div>
  `;
}

function renderMarkets(isPreliminary){
  // Never render a market card with zero options — that's exactly what
  // produced an empty-looking, broken card. A market only earns a spot on
  // screen once it actually has something to show.
  const markets = (matchData.markets || []).filter(mk => Array.isArray(mk.options) && mk.options.length > 0);
  const container = document.getElementById('marketsContainer');

  if (!markets.length) {
    container.innerHTML = isPreliminary
      // We know more markets are coming (the real fetch is still in flight)
      // — say so plainly rather than a generic/empty state that reads like
      // this match simply has no odds at all.
      ? `<div class="market-card" style="text-align:center;padding:28px 16px">
           <div class="loading" style="margin:0">Loading markets…</div>
         </div>`
      : '<div class="loading">No odds available for this match right now.</div>';
    document.getElementById('modeToggle').style.display = 'none';
    return;
  }
  document.getElementById('modeToggle').style.display = markets.length >= 2 ? 'flex' : 'none';

  // Render each market independently and never let one bad/unexpected market
  // shape take down the whole page — previously a single throw inside this
  // map (e.g. a non-numeric odds value, or a market missing `.options`) left
  // marketsContainer completely blank with no error shown at all, even
  // though the header above had already rendered fine from a separate call.
  container.innerHTML = markets.map(mk => {
    try {
      return renderCard(mk);
    } catch (e) {
      console.warn('[match] failed to render a market — skipping it, not the whole page:', mk, e);
      return '';
    }
  }).join('');

  // Restore selection highlighting if this match/market/pick is already in the slip
  slip.forEach(s => {
    if (s.matchId === matchId) {
      const el = document.getElementById(`mkt_${s.market}_${s.pick}`);
      if (el) el.classList.add('sel');
    }
  });
}

// Each card carries its market key so a refresh can swap only the cards whose
// prices changed (everything else, scroll position and the slip stay untouched).
function renderCard(mk){
  const html = renderOneMarket(mk);
  const cls = mk.__closed ? 'market-card mkt-closed' : 'market-card';
  const note = mk.__closed ? '<div class="suspended-note">Market closed or unavailable right now.</div>' : '';
  return html.replace('class="market-card"', 'class="' + cls + '" data-mk="' + escapeHtml(mk.market) + '"').replace(/<\/div>\s*$/, note + '</div>');
}
function cardSig(mk){
  return JSON.stringify([mk.label, mk.wholeMarketSuspended, mk.hasSuspendedPick,
    (mk.options || []).map(o => [o.pick, o.pickLabel, o.odds, o.boostedOdds, o.suspended]), !!mk.__closed]);
}

// Apply a newer response IN PLACE: unchanged cards are not touched, changed
// cards get a quick flash, markets that vanished are greyed out as unavailable.
function patchMarkets(newData){
  const container = document.getElementById('marketsContainer');
  const next = (newData.markets || []).filter(mk => Array.isArray(mk.options) && mk.options.length > 0);
  const old = (matchData && matchData.markets || []).filter(mk => Array.isArray(mk.options) && mk.options.length > 0);
  // Never replace a full list with a thin/empty one (a slow provider answered badly).
  if (next.length < 2 && old.length >= 2) return false;
  // A market that was open and is no longer offered is shown greyed out as
  // closed (never silently dropped, never bettable) until the next full load.
  const nextKeys = new Set(next.map(mk => mk.market));
  const closed = old.filter(mk => !nextKeys.has(mk.market)).map(mk => Object.assign({}, mk, { __closed: true }));
  const oldSig = new Map(old.map(mk => [mk.market, cardSig(mk)]));
  newData = Object.assign({}, newData, { markets: next.concat(closed) });
  next.push(...closed);
  const cards = new Map();
  container.querySelectorAll('.market-card[data-mk]').forEach(el => cards.set(el.getAttribute('data-mk'), el));
  // Same set of markets in the same order -> pure in-place patch. Otherwise re-render.
  const sameLayout = cards.size === next.length && next.every((mk, i) => {
    const el = cards.get(mk.market); return el && container.children[i] === el;
  });
  matchData = Object.assign({}, newData, { __full: true });
  if (!sameLayout) { renderMarkets(false); return true; }
  next.forEach(mk => {
    if (oldSig.get(mk.market) === cardSig(mk)) return;
    const el = cards.get(mk.market);
    const tmp = document.createElement('div');
    tmp.innerHTML = renderCard(mk).trim();
    const fresh = tmp.firstElementChild;
    if (!fresh) return;
    fresh.classList.add('odds-flash');
    el.replaceWith(fresh);
    setTimeout(() => fresh.classList.remove('odds-flash'), 1200);
  });
  slip.forEach(sl => {
    if (sl.matchId === matchId) { const el = document.getElementById('mkt_' + sl.market + '_' + sl.pick); if (el) el.classList.add('sel'); }
  });
  return true;
}

// ONE background refresher for this page: no overlapping requests, no duplicate
// timers, paused while the tab is hidden, backs off after errors.
let _refreshTimer = null, _refreshBusy = false, _refreshFails = 0, _refreshSeq = 0;
function startMarketsRefresh(){
  if (_refreshTimer || !matchId) return;
  const host = document.getElementById('marketsContainer');
  const tick = async () => {
    _refreshTimer = null;
    if (!host || !host.isConnected) { return; }   // page was navigated away: stop for good
    const delay = () => (_refreshFails ? Math.min(60000, 8000 * Math.pow(2, _refreshFails)) : (matchData && matchData.status === 'live' ? 8000 : 15000));
    if (document.hidden || _refreshBusy || !document.getElementById('marketsContainer')) { _refreshTimer = setTimeout(tick, delay()); return; }
    _refreshBusy = true;
    const mySeq = ++_refreshSeq;
    try {
      const r = await fetch('/api/odds/match/' + encodeURIComponent(matchId) + '?rich=1', { cache: 'no-store' });
      const d = await r.json();
      if (mySeq === _refreshSeq && d && d.success && d.data && !d.data.marketsPending && !isStaleResponse(d)) {
        if (patchMarkets(d.data)) { renderHeader(); updateSlipBar(); }
        _refreshFails = 0;
      } else if (!d || !d.success) _refreshFails++;
    } catch (e) { _refreshFails++; }
    finally { _refreshBusy = false; _refreshTimer = setTimeout(tick, delay()); }
  };
  _refreshTimer = setTimeout(tick, 8000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && _refreshTimer) { clearTimeout(_refreshTimer); _refreshTimer = null; _refreshBusy = false; startMarketsRefresh(); } });

const REASON_LABELS = {
  stale_data: 'Live data updating',
  goal_event: 'Odds recalculating after goal',
  mathematically_certain: 'Outcome decided',
  lead_rule: 'Selection suspended',
  draw_late: 'Selection suspended'
};

// num(): every place an odds value gets displayed or put in a click handler
// goes through this instead of calling .toFixed() directly on the raw value.
// Odds can arrive as a string, null, or otherwise-shaped value depending on
// which part of the pipeline produced this particular market, and a bare
// `.toFixed()` call throws immediately on anything that isn't already a
// number — which is exactly what was blanking the whole markets list.
function num(v, fallback){
  const n = Number(v);
  return Number.isFinite(n) ? n : (fallback ?? 0);
}

function renderOneMarket(mk){
    const options = Array.isArray(mk.options) ? mk.options : [];
    // SofaBets-native markets are real provider prices. They are displayed
    // exactly as supplied by SofaBets; unsupported provider markets remain
    // view-only so SafariBet never accepts a bet it cannot settle safely.
    if (mk.providerMarket) {
      return `
      <div class="market-card">
        <div class="market-hd">
          <span class="market-name">${escapeHtml(mk.label)}</span>
          <span style="font-size:9px;color:var(--g);font-weight:700">SAFARIBET</span>
        </div>
        <div class="market-body">
          ${options.map(opt => `
            <div class="odd-btn" style="${opt.bettable ? '' : 'cursor:default'}" ${opt.bettable ? `id=\"mkt_${escapeAttr(mk.market)}_${escapeAttr(opt.pick)}\" onclick=\"toggleMarketPick('${escapeAttr(mk.market)}','${escapeAttr(opt.pick)}',${num(opt.boostedOdds||opt.odds)},'${escapeAttr(opt.pickLabel || opt.pick)}','${escapeAttr(mk.providerMarketId || '')}','${escapeAttr(mk.providerMarketKey || '')}','${escapeAttr(opt.providerSelectionId || '')}','${escapeAttr(opt.providerSelectionKey || opt.pick || '')}')\"` : ''}>
              <div class="odd-lbl">${escapeHtml(opt.pickLabel || opt.pick)}</div>
              <div class="odd-val">${num(opt.boostedOdds || opt.odds).toFixed(2)}</div>
            </div>`).join('')}
        </div>
      </div>`;
    }

    // Whole market suspended (every outcome locked) — show one clear banner
    // instead of a row of individually greyed-out buttons. This is the exact
    // "🔒 Odds Updating" state: temporary if it's a stale-data/goal-event
    // reason, otherwise the market is suspended because the risk rules judge
    // it effectively decided.
    if (mk.wholeMarketSuspended) {
      const anyReason = (options.find(o => o.reason) || {}).reason;
      const isTemporary = anyReason === 'stale_data' || anyReason === 'goal_event';
      return `
      <div class="market-card">
        <div class="market-hd"><span class="market-name">${mk.label}</span></div>
        <div class="market-body" style="justify-content:center">
          <div class="odd-btn" style="opacity:.6;cursor:default;flex:0 0 auto;min-width:200px;text-align:center" onclick="event.stopPropagation()">
            <div class="odd-lbl">🔒 Odds Updating</div>
          </div>
        </div>
        <div class="suspended-note">${isTemporary ? 'Recalculating odds for this match — selections will reopen automatically once fresh prices are confirmed.' : 'This market is suspended — the outcome is already effectively decided.'}</div>
      </div>`;
    }

    return `
    <div class="market-card">
      <div class="market-hd">
        <span class="market-name">${escapeHtml(mk.label)}</span>
        <span style="font-size:9px;color:var(--g);font-weight:700">${mk.isSynthetic ? 'CALCULATED' : 'SAFARIBET'}</span>
      </div>
      <div class="market-body">
        ${options.map(opt => opt.suspended ? `
          <div class="odd-btn" style="opacity:.5;cursor:default" onclick="event.stopPropagation()" title="${REASON_LABELS[opt.reason] || 'Selection suspended'}">
            <div class="odd-lbl">${escapeHtml(opt.pickLabel || pickLabel(mk.market, opt.pick))}</div>
            <div class="odd-val">🔒</div>
          </div>
        ` : `
          <div class="odd-btn ${opt.boostedOdds?'boosted':''}" id="mkt_${mk.market}_${opt.pick}" onclick="toggleMarketPick('${mk.market}','${opt.pick}',${num(opt.boostedOdds||opt.odds)},'${escapeAttr(pickLabel(mk.market,opt.pick))}')">
            ${opt.boostedOdds ? '<div class="boost-flag">⚡ BOOST</div>' : ''}
            <div class="odd-lbl">${escapeHtml(opt.pickLabel || pickLabel(mk.market, opt.pick))}</div>
            ${opt.boostedOdds
              ? `<div class="odd-val-old">${num(opt.odds).toFixed(2)}</div><div class="odd-val boosted-val">${num(opt.boostedOdds).toFixed(2)}</div>`
              : `<div class="odd-val">${num(opt.odds).toFixed(2)}</div>`}
          </div>
        `).join('')}
      </div>
      ${mk.hasSuspendedPick ? `<div class="suspended-note">🔒 A selection on this market is suspended — that outcome is already effectively decided, or odds are being recalculated.</div>` : ''}
      ${options.some(o=>o.boostedOdds) ? `<div class="boost-note">⚡ Boosted odds apply to stakes up to KES ${num(options.find(o=>o.boostedOdds).maxQualifyingStake).toLocaleString()} on that selection — normal odds apply beyond that.</div>` : ''}
    </div>
  `;
}

function pickLabel(market, pick){
  const h = matchData.homeTeam, a = matchData.awayTeam;
  const LABELS = {
    '1x2':      { home: h, draw: 'Draw', away: a },
    'ou25':     { over25: 'Over 2.5', under25: 'Under 2.5' },
    'btts':     { btts: 'Yes', btts_no: 'No' },
    'dc':       { dc_1x: `${h} or Draw`, dc_x2: `Draw or ${a}`, dc_12: `${h} or ${a}` },
    'dnb':      { dnb_home: h, dnb_away: a },
    'handicap': { handicap_home: h, handicap_away: a }
  };
  return LABELS[market]?.[pick] || pick;
}

function escapeHtml(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }
function escapeAttr(s){ return String(s).replace(/'/g, "\\'"); }

let mode = 'slip';
let builderLegs = [];

function setMode(m){
  mode = m;
  document.getElementById('modeBtnSlip').classList.toggle('active', m==='slip');
  document.getElementById('modeBtnBuilder').classList.toggle('active', m==='builder');
  document.getElementById('slipBar').style.display = (m==='slip' && slip.length) ? 'flex' : 'none';
  document.getElementById('builderBar').style.display = (m==='builder') ? 'block' : 'none';
  // Clear visual selection state and re-apply for the active mode only
  document.querySelectorAll('.odd-btn').forEach(el => el.classList.remove('sel'));
  if (m === 'slip') {
    slip.forEach(s => { if (s.matchId===matchId) document.getElementById(`mkt_${s.market}_${s.pick}`)?.classList.add('sel'); });
  } else {
    builderLegs.forEach(l => document.getElementById(`mkt_${l.market}_${l.pick}`)?.classList.add('sel'));
  }
  updateBuilderBar();
}

function toggleMarketPick(market, pick, odds, pickLabelText, providerMarketId, providerMarketKey, providerSelectionId, providerSelectionKey){
  if (mode === 'builder') { toggleBuilderLeg(market, pick, odds, pickLabelText); return; }

  // Quick Pick allows only ONE selection per MATCH (any market), not one per
  // market — picking, say, "Home Win" and "Home or Draw" (Double Chance) on
  // the same match and multiplying their odds together in a regular multi-bet
  // massively overpays, since the second pick is nearly guaranteed once the
  // first is true (they're not independent risks). Combining multiple markets
  // on one match is exactly what Bet Builder mode is for, where a correlation
  // discount is correctly applied — so Quick Pick deliberately restricts to
  // one pick per match, same as the homepage's slip always has.
  const existIdx = slip.findIndex(s => s.matchId === matchId);
  const same = existIdx !== -1 && slip[existIdx].market === market && slip[existIdx].pick === pick;

  // Deselect ANY previously selected market/pick for this match, not just this one
  if (matchData.markets) {
    matchData.markets.forEach(mk => mk.options.forEach(opt => {
      document.getElementById(`mkt_${mk.market}_${opt.pick}`)?.classList.remove('sel');
    }));
  }

  if (same) {
    slip.splice(existIdx, 1);
  } else {
    if (existIdx !== -1) slip.splice(existIdx, 1);
    slip.push({
      matchId, market, pick,
      homeTeam: matchData.homeTeam, awayTeam: matchData.awayTeam,
      league: matchData.league, sport: matchData.sport,
      pickLabel: pickLabelText, odds: parseFloat(odds),
      commenceTime: matchData.commenceTime,
      ...(String(market).startsWith('sb:') ? {
        marketLabel: ((matchData.markets || []).find(m => m.market === market) || {}).label || '',
        isLive: matchData.status === 'live',
        provider: 'sofabets',
        providerMarketId: providerMarketId || null,
        providerMarketKey: providerMarketKey || String(market).slice(3),
        providerSelectionId: providerSelectionId || null,
        providerSelectionKey: providerSelectionKey || pick
      } : {})
    });
    document.getElementById(`mkt_${market}_${pick}`)?.classList.add('sel');
  }

  localStorage.setItem('betslip', JSON.stringify(slip));
  updateSlipBar();
}

// ── BET BUILDER (multiple markets, same match, combined into one bet) ──
function toggleBuilderLeg(market, pick, odds, pickLabelText){
  const existIdx = builderLegs.findIndex(l => l.market === market);
  const same = existIdx !== -1 && builderLegs[existIdx].pick === pick;

  if (matchData.markets) {
    const mk = matchData.markets.find(m => m.market === market);
    if (mk) mk.options.forEach(opt => {
      document.getElementById(`mkt_${market}_${opt.pick}`)?.classList.remove('sel');
    });
  }

  if (same) {
    builderLegs.splice(existIdx, 1);
  } else {
    if (existIdx !== -1) builderLegs.splice(existIdx, 1);
    builderLegs.push({ matchId, market, pick, pickLabel: pickLabelText, odds: parseFloat(odds) });
    document.getElementById(`mkt_${market}_${pick}`)?.classList.add('sel');
  }
  updateBuilderBar();
}

function updateBuilderBar(){
  document.getElementById('builderLegCount').textContent = `${builderLegs.length} market${builderLegs.length===1?'':'s'} selected`;
  if (builderLegs.length < 2) {
    document.getElementById('builderOdds').textContent = 'Odds: — (pick 2+)';
    return;
  }
  // Same correlation-discount formula as the server (server re-verifies and is authoritative)
  let combined = builderLegs[0].odds;
  for (let i = 1; i < builderLegs.length; i++) combined = combined * builderLegs[i].odds * 0.90;
  document.getElementById('builderOdds').textContent = `Odds: ${combined.toFixed(2)}`;
}

async function placeBetBuilder(){
  const el = document.getElementById('builderRes');
  if (builderLegs.length < 2) { el.className='res er'; el.textContent='Pick at least 2 markets'; return; }
  const stake = parseFloat(document.getElementById('builderStake').value);
  if (!stake || stake < 10) { el.className='res er'; el.textContent='Enter a stake (min KES 10)'; return; }

  const token = localStorage.getItem('token');
  if (!token) { SB.go('/login'); return; }

  el.className='res'; el.textContent='Placing bet...';
  try{
    const r = await fetch('/api/bets/place-builder', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body: JSON.stringify({ legs: builderLegs, stake })
    });
    const d = await r.json();
    if (d.success) {
      el.className='res ok'; el.textContent=`✅ Bet placed! Code: ${d.betCode}`;
      builderLegs = [];
      document.getElementById('builderStake').value = '';
      document.querySelectorAll('.odd-btn.sel').forEach(b=>b.classList.remove('sel'));
      updateBuilderBar();
      setTimeout(() => SB.go('/my-bets'), 1200);
    } else {
      el.className='res er'; el.textContent = '❌ ' + (d.message || 'Failed to place bet');
    }
  }catch(e){
    el.className='res er'; el.textContent='❌ Failed — check connection';
  }
}

function updateSlipBar(){
  const bar = document.getElementById('slipBar');
  if (!slip.length || mode !== 'slip') { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  document.getElementById('slipCount').textContent = `${slip.length} selection${slip.length>1?'s':''}`;
  const totalOdds = slip.reduce((acc,s)=>acc*s.odds, 1);
  document.getElementById('slipOdds').textContent = `Odds ${totalOdds.toFixed(2)} · View Slip →`;
}

// Refresh live score/minute periodically without losing selections
// (live score / odds refresh is handled by startMarketsRefresh() above)
</script>
<script>SB.run()</script>
</body>
</html>
