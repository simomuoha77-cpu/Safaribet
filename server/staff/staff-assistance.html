<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SafariBet Staff Assistance</title>
<style>
:root{--bg:#0b1210;--card:#121c18;--card2:#17241f;--line:#223229;--tx:#e6f2ea;--mut:#8aa396;--g:#1fd36b;--g2:#0fa650;--y:#f5c542;--r:#ff5d5d;--b:#4aa8ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--g);text-decoration:none}button,input,select,textarea{font:inherit;color:var(--tx)}
.top{position:sticky;top:0;z-index:5;background:#0e1814;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{font-weight:800;font-size:18px;letter-spacing:.5px}.brand b{color:var(--y)}.brand small{display:block;font-size:10px;color:var(--mut);font-weight:600;letter-spacing:1px;text-transform:uppercase}
.sp{flex:1}.who{font-size:12px;color:var(--mut);text-align:right}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#0e1814;border-bottom:1px solid var(--line);position:sticky;top:53px;z-index:4}
nav a{white-space:nowrap;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:600}
nav a.on{background:var(--g2);color:#fff;border-color:var(--g2)}
nav .badge{background:var(--r);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
main{max-width:1100px;margin:0 auto;padding:14px 14px 70px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:18px 0 8px;color:var(--g)}h3{font-size:14px;margin:12px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--mut)}
.stat.warn b{color:var(--y)}.stat.bad b{color:var(--r)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;background:#0c1511;border:1px solid var(--line);border-radius:9px;padding:10px 11px}
textarea{min-height:80px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--g2);border-color:transparent}
.btn{background:var(--g2);color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--card2);border:1px solid var(--line);color:var(--tx)}.btn.red{background:#b83a3a}.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:130px}.row>.btn{flex:0 0 auto}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.pill.open{color:var(--b)}.pill.pending{color:var(--y)}.pill.escalated,.pill.urgent,.pill.failed,.pill.lost,.pill.denied,.pill.failure,.pill.rejected{color:var(--r)}.pill.resolved,.pill.won,.pill.completed,.pill.success,.pill.approved,.pill.active{color:var(--g)}
.pill.high{color:var(--y)}.pill.void,.pill.cancelled,.pill.closed,.pill.low{color:var(--mut)}
.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;color:var(--tx)}.item:hover{border-color:var(--g2)}
.item .t{font-weight:700}.item .m{font-size:12px;color:var(--mut);margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px}
.scroll{overflow-x:auto}.mut{color:var(--mut)}.small{font-size:12px}.err{background:#3a1a1a;border:1px solid #6b2a2a;color:#ffb4b4;padding:10px;border-radius:9px;margin:8px 0}
.ok{background:#12301f;border:1px solid #1f5a37;color:#9be8bb;padding:10px;border-radius:9px;margin:8px 0}.warnbox{background:#33290f;border:1px solid #6b5a1f;color:#f5d98a;padding:10px;border-radius:9px;margin:8px 0}
.msg{border-radius:10px;padding:9px 11px;margin:7px 0;border:1px solid var(--line)}.msg.customer{background:#10261b;border-color:#1f5a37}.msg.internal{background:#2a2410;border-color:#5a4a1a}
.msg .h{font-size:11px;color:var(--mut);margin-bottom:3px}.pre{white-space:pre-wrap;word-break:break-word}
.center{max-width:420px;margin:8vh auto 0;padding:0 14px}.bar{height:8px;background:var(--g2);border-radius:4px;min-width:2px}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0}.hide{display:none}
code{background:#0c1511;padding:2px 6px;border-radius:6px;word-break:break-all}
@media(min-width:760px){main{padding-top:20px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ── tiny safe DOM helpers: every dynamic value goes in through textContent, never innerHTML ── */
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k of Object.keys(attrs)) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'value') e.value = v; else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c))); }
  return e;
}
const $ = (s, r) => (r || document).querySelector(s);
const fmt = d => d ? new Date(d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '—';
const kes = n => 'KES ' + Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
const pill = (t, cls) => el('span', { class: 'pill ' + (cls || t) }, String(t).replace(/_/g, ' '));
const S = { csrf: null, staff: null, perms: [], stage: null, setup: {}, unread: 0 };
const can = p => S.perms.includes(p);

/* ── API ── */
async function api(method, path, body, extraHeaders) {
  const opts = { method, credentials: 'same-origin', headers: { 'Accept': 'application/json' } };
  if (S.csrf && method !== 'GET') opts.headers['X-CSRF-Token'] = S.csrf;
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  Object.assign(opts.headers, extraHeaders || {});
  let r, d;
  try { r = await fetch('/api/assistance' + path, opts); d = await r.json().catch(() => ({})); }
  catch (e) { return { success: false, message: 'Network problem. Check your connection.' }; }
  if (r.status === 401 && S.staff) { S.staff = null; S.csrf = null; renderLogin(d.message || 'Session ended — please sign in again.'); return { success: false, message: d.message, handled: true }; }
  if (r.status === 403 && d.code === 'CSRF') { await loadSession(); }
  d.httpStatus = r.status; return d;
}
const GET = (p, q) => api('GET', p + (q ? '?' + new URLSearchParams(Object.entries(q).filter(([, v]) => v !== '' && v != null)).toString() : ''));
const POST = (p, b, h) => api('POST', p, b || {}, h);

function msgBox(host, text, kind) { const old = $('.flash', host); if (old) old.remove(); host.prepend(el('div', { class: (kind === 'ok' ? 'ok' : kind === 'warn' ? 'warnbox' : 'err') + ' flash' }, text)); }

/* ── session / shell ── */
async function loadSession() {
  const d = await GET('/auth/session');
  if (d && d.authenticated) { S.csrf = d.csrf; S.staff = d.staff; S.perms = d.permissions; S.stage = d.stage; S.setup = d.setup || {}; S.roleLabel = d.roleLabel; return true; }
  S.staff = null; S.csrf = null; S.perms = []; return false;
}
function app() { return $('#app'); }
function clearApp() { app().replaceChildren(); }

function renderLogin(notice) {
  clearApp();
  const form = el('form', { class: 'card', autocomplete: 'off' },
    el('h1', null, 'Staff sign in'),
    notice ? el('div', { class: 'err' }, notice) : null,
    el('label', null, 'Username'), el('input', { name: 'username', autocomplete: 'username', autocapitalize: 'none', required: true }),
    el('label', null, 'Password'), el('input', { name: 'password', type: 'password', autocomplete: 'current-password', required: true }),
    el('label', null, 'Authenticator code (leave empty on your very first sign-in)'), el('input', { name: 'code', inputmode: 'numeric', autocomplete: 'one-time-code', placeholder: '6-digit code or recovery code' }),
    el('div', { style: 'margin-top:14px' }, el('button', { class: 'btn', type: 'submit', style: 'width:100%' }, 'Sign in')),
    el('p', { class: 'small mut', style: 'margin-top:12px' }, 'Forgot your password? ', el('a', { href: '#', onclick: e => { e.preventDefault(); renderReset(); } }, 'Ask the administrator to reset it')));
  form.addEventListener('submit', async e => {
    e.preventDefault(); const f = new FormData(form), btn = $('button', form); btn.disabled = true;
    const d = await api('POST', '/auth/login', { username: f.get('username'), password: f.get('password'), code: f.get('code') });
    btn.disabled = false;
    if (!d.success) { msgBox(form, d.message || 'Sign-in failed.'); return; }
    S.csrf = d.csrf; S.staff = d.staff; S.perms = d.permissions; S.stage = d.stage; S.setup = d.setup || {}; S.roleLabel = d.roleLabel;
    boot();
  });
  app().append(el('div', { class: 'center' }, el('div', { class: 'brand', style: 'text-align:center;margin-bottom:14px;font-size:24px' }, 'Safari', el('b', null, 'Bet'), el('small', null, 'Staff Assistance')), form));
}
function renderReset() {
  clearApp();
  const form = el('form', { class: 'card' }, el('h1', null, 'Password help'),
    el('p', { class: 'mut small' }, 'No email is sent. This leaves a request for the administrator, who will reset your password and contact you.'),
    el('label', null, 'Your username'), el('input', { name: 'username', required: true, autocapitalize: 'none' }),
    el('div', { style: 'margin-top:14px' }, el('button', { class: 'btn', type: 'submit' }, 'Send request'), ' ', el('button', { class: 'btn sec', type: 'button', onclick: () => renderLogin() }, 'Back')));
  form.addEventListener('submit', async e => { e.preventDefault(); const d = await POST('/auth/request-reset', { username: new FormData(form).get('username') }); msgBox(form, d.message || d.msg || 'Done.', d.success ? 'ok' : 'err'); });
  app().append(el('div', { class: 'center' }, form));
}

/* first sign-in: choose a password, then enrol an authenticator app */
function renderSetup() {
  clearApp();
  const box = el('div', { class: 'center' });
  app().append(box);
  box.append(el('div', { class: 'brand', style: 'text-align:center;margin-bottom:12px' }, 'Safari', el('b', null, 'Bet'), el('small', null, 'Account setup')));
  if (S.setup.mustChangePassword) {
    const f = el('form', { class: 'card' }, el('h1', null, 'Choose a new password'),
      el('p', { class: 'mut small' }, 'At least 12 characters with upper and lower case letters, a number and a symbol.'),
      el('label', null, 'Temporary password'), el('input', { name: 'cur', type: 'password', autocomplete: 'current-password', required: true }),
      el('label', null, 'New password'), el('input', { name: 'nw', type: 'password', autocomplete: 'new-password', required: true }),
      el('label', null, 'Repeat new password'), el('input', { name: 'nw2', type: 'password', autocomplete: 'new-password', required: true }),
      el('div', { style: 'margin-top:14px' }, el('button', { class: 'btn', type: 'submit' }, 'Save password')));
    f.addEventListener('submit', async e => {
      e.preventDefault(); const v = new FormData(f);
      if (v.get('nw') !== v.get('nw2')) return msgBox(f, 'The two new passwords are different.');
      const d = await POST('/auth/change-password', { currentPassword: v.get('cur'), newPassword: v.get('nw') });
      if (!d.success) return msgBox(f, d.message || 'Could not change password.');
      S.csrf = d.csrf; S.staff = d.staff; S.perms = d.permissions; S.stage = d.stage; S.setup = d.setup || {}; boot();
    });
    box.append(f); return;
  }
  if (S.setup.needs2fa) {
    const card = el('div', { class: 'card' }, el('h1', null, 'Set up two-factor sign-in'), el('p', { class: 'mut small' }, 'Install an authenticator app (Google Authenticator, Authy, Microsoft Authenticator), then scan the code below.'));
    const holder = el('div'); card.append(holder); box.append(card);
    holder.append(el('button', { class: 'btn', onclick: async ev => {
      ev.target.disabled = true; const d = await POST('/auth/2fa/setup');
      if (!d.success) { ev.target.disabled = false; return msgBox(card, d.message || 'Could not start setup.'); }
      holder.replaceChildren();
      if (d.qrDataUrl) holder.append(el('div', { style: 'text-align:center;background:#fff;border-radius:10px;padding:10px;margin:10px 0' }, el('img', { src: d.qrDataUrl, alt: 'QR code', style: 'width:200px;height:200px' })));
      holder.append(el('p', { class: 'small mut' }, 'Cannot scan? Enter this key by hand:'), el('p', null, el('code', null, d.manualKey)));
      const f = el('form', null, el('label', null, 'Code from the app'), el('input', { name: 'code', inputmode: 'numeric', autocomplete: 'one-time-code', required: true }), el('div', { style: 'margin-top:12px' }, el('button', { class: 'btn', type: 'submit' }, 'Confirm')));
      f.addEventListener('submit', async e => {
        e.preventDefault(); const r = await POST('/auth/2fa/confirm', { code: new FormData(f).get('code') });
        if (!r.success) return msgBox(f, r.message || 'Wrong code.');
        S.csrf = r.csrf; S.staff = r.staff; S.perms = r.permissions; S.stage = r.stage; S.setup = r.setup || {};
        box.replaceChildren(el('div', { class: 'card' }, el('h1', null, 'Save your recovery codes'),
          el('div', { class: 'warnbox' }, 'Each code works once if you lose your phone. They are shown ONLY now. Write them down and keep them private.'),
          el('div', { class: 'pre' }, r.recoveryCodes.map(c => el('div', null, el('code', null, c)))),
          el('div', { style: 'margin-top:14px' }, el('button', { class: 'btn', onclick: () => boot() }, 'I have saved them — continue'))));
      });
      holder.append(f);
    } }, 'Show QR code'));
    return;
  }
  box.append(el('div', { class: 'card' }, 'Setup is complete.', el('div', { style: 'margin-top:10px' }, el('button', { class: 'btn', onclick: () => boot() }, 'Continue'))));
}

const NAV = [
  ['#/dashboard', 'Dashboard', () => true], ['#/tickets', 'Tickets', () => can('tickets.view')], ['#/players', 'Players', () => can('players.search')],
  ['#/bets', 'Bets', () => can('bets.view')], ['#/transactions', 'Transactions', () => can('tx.view')], ['#/risk', 'Risk', () => can('risk.view')],
  ['#/reports', 'Reports', () => can('reports.read')], ['#/audit', 'Audit', () => can('audit.read')], ['#/staff', 'Staff', () => can('staff.view')],
  ['#/notifications', 'Alerts', () => true]
];
function renderShell() {
  clearApp();
  const nav = el('nav', { id: 'nav' }, NAV.filter(n => n[2]()).map(n => el('a', { href: n[0], 'data-h': n[0] }, n[1], n[0] === '#/notifications' ? el('span', { class: 'badge hide', id: 'nbadge' }) : null)));
  app().append(
    el('div', { class: 'top' }, el('div', { class: 'brand' }, 'Safari', el('b', null, 'Bet'), el('small', null, 'Staff Assistance')), el('div', { class: 'sp' }),
      el('div', { class: 'who' }, S.staff.displayName, el('br'), S.roleLabel || ''),
      el('button', { class: 'btn sec sm', onclick: async () => { await POST('/auth/logout'); S.staff = null; S.csrf = null; renderLogin('You have signed out.'); } }, 'Sign out')),
    nav, el('main', { id: 'main' }));
  refreshBadge();
}
async function refreshBadge() { const d = await GET('/notifications'); if (d.success) { S.unread = d.unread; const b = $('#nbadge'); if (b) { b.textContent = d.unread; b.classList.toggle('hide', !d.unread); } } }
function setNavOn(hash) { document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', hash.startsWith(a.getAttribute('data-h')))); }

/* ── router ── */
const routes = [];
function route(re, fn) { routes.push([re, fn]); }
async function router() {
  if (!S.staff || S.stage !== 'full') return;
  const hash = location.hash || '#/dashboard', q = {};
  const [pathPart, qs] = hash.split('?'); if (qs) new URLSearchParams(qs).forEach((v, k) => q[k] = v);
  setNavOn(pathPart);
  const main = $('#main'); main.replaceChildren(el('p', { class: 'mut' }, 'Loading…'));
  for (const [re, fn] of routes) { const m = re.exec(pathPart); if (m) { try { main.replaceChildren(); await fn(main, m.slice(1).map(decodeURIComponent), q); } catch (e) { console.error(e); main.replaceChildren(el('div', { class: 'err' }, 'This page failed to load.')); } return; } }
  main.replaceChildren(el('div', { class: 'card' }, 'Page not found.'));
}
window.addEventListener('hashchange', router);
const need = (main, p) => { if (can(p)) return true; main.append(el('div', { class: 'err' }, 'You do not have access to this page.')); return false; };
function pager(host, d, go) {
  if (!d || d.pages <= 1) return;
  host.append(el('div', { class: 'pager' }, el('button', { class: 'btn sec sm', disabled: d.page <= 1, onclick: () => go(d.page - 1) }, '← Prev'), el('span', { class: 'mut small' }, `Page ${d.page} of ${d.pages} · ${d.total} total`), el('button', { class: 'btn sec sm', disabled: d.page >= d.pages, onclick: () => go(d.page + 1) }, 'Next →')));
}
const sel = (name, opts, cur) => el('select', { name }, opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return el('option', { value: v, selected: v === cur }, l); }));
const CATS = ['account', 'deposit', 'withdrawal', 'bet_dispute', 'bonus', 'technical', 'responsible_gaming', 'risk', 'other'].map(c => [c, c.replace(/_/g, ' ')]);
const PRIS = ['low', 'normal', 'high', 'urgent'];

/* ── dashboard ── */
route(/^#\/dashboard$/, async main => {
  const d = await GET('/dashboard'); if (!d.success) return main.append(el('div', { class: 'err' }, d.message || 'Could not load.'));
  main.append(el('h1', null, 'Welcome, ' + S.staff.displayName));
  const stat = (n, label, cls, href) => el(href ? 'a' : 'div', { class: 'stat ' + (cls || ''), href }, el('b', null, n), el('span', null, label));
  const g = [];
  if (d.tickets) g.push(stat(d.tickets.open, 'Open tickets', '', '#/tickets?status=open'), stat(d.tickets.pending, 'Pending', '', '#/tickets?status=pending'), stat(d.tickets.escalated, 'Escalated', d.tickets.escalated ? 'warn' : '', '#/tickets?status=escalated'), stat(d.tickets.assignedToMe, 'Assigned to me', '', '#/tickets?assigned=me&status=active'), stat(d.tickets.overdue, 'Overdue', d.tickets.overdue ? 'bad' : '', '#/tickets?overdue=1'));
  if (d.finance) g.push(stat(d.finance.pendingTransactions, 'Pending deposits/withdrawals', d.finance.pendingTransactions ? 'warn' : '', '#/transactions?status=pending'), stat(d.finance.reviewsAwaitingApproval, 'Reviews awaiting approval', d.finance.reviewsAwaitingApproval ? 'warn' : '', '#/transactions?queue=pending_approval'));
  if (d.accountIssues) g.push(stat(d.accountIssues.lockedAccounts, 'Locked accounts', d.accountIssues.lockedAccounts ? 'warn' : ''), stat(d.accountIssues.openAccountTickets, 'Open account issues'));
  g.push(stat(d.unreadNotifications, 'Unread alerts', d.unreadNotifications ? 'warn' : '', '#/notifications'));
  main.append(el('div', { class: 'grid' }, g));
  if (d.stats) main.append(el('div', { class: 'card', style: 'margin-top:12px' }, el('h3', null, 'Activity'), el('div', { class: 'small mut' },
    d.stats.ticketsCreatedToday != null ? `Tickets: ${d.stats.ticketsCreatedToday} created today · ${d.stats.ticketsResolvedToday} resolved today · ${d.stats.ticketsCreatedWeek} created / ${d.stats.ticketsResolvedWeek} resolved in 7 days. ` : '',
    d.stats.reviewsToday != null ? `Finance reviews: ${d.stats.reviewsToday} today · ${d.stats.reviewsWeek} in 7 days.` : '')));
  const list = (title, arr) => { if (!arr || !arr.length) return; main.append(el('h2', null, title), arr.map(ticketItem)); };
  list('Assigned to me', d.recentAssigned); list('Recent bet investigations', d.recentBetInvestigations);
  if (d.recentActivity && d.recentActivity.length) main.append(el('h2', null, can('audit.read') ? 'Recent staff activity' : 'My recent activity'), el('div', { class: 'card scroll' }, el('table', null, el('tbody', null, d.recentActivity.map(a => el('tr', null, el('td', { class: 'small mut' }, fmt(a.at)), el('td', null, a.by || ''), el('td', null, a.action), el('td', null, pill(a.outcome))))))));
});
const ticketItem = t => el('a', { class: 'item', href: '#/tickets/' + t.ticketNo }, el('div', { class: 't' }, t.ticketNo + ' · ' + t.subject), el('div', { class: 'm' }, pill(t.status), ' ', pill(t.priority), t.overdue ? [' ', pill('overdue', 'failed')] : '', ' · ', t.team, ' · ', t.assignedToName ? 'with ' + t.assignedToName : 'unassigned', t.player ? ' · ' + t.player.username : '', ' · ', fmt(t.updatedAt)));

/* ── tickets ── */
route(/^#\/tickets$/, async (main, _, q) => {
  if (!need(main, 'tickets.view')) return;
  const f = { status: q.status || 'active', assigned: q.assigned || '', q: q.q || '', category: q.category || '', overdue: q.overdue || '', kind: q.kind || '' };
  main.append(el('div', { class: 'row', style: 'justify-content:space-between;align-items:center' }, el('h1', { style: 'margin:0' }, 'Tickets'), can('tickets.manage') ? el('a', { class: 'btn sm', href: '#/tickets/new' }, '+ New ticket') : null));
  const bar = el('div', { class: 'card' }, el('div', { class: 'row' },
    el('div', null, el('label', null, 'Status'), sel('status', [['active', 'Active'], 'open', 'pending', 'escalated', 'resolved', 'closed', ['', 'Any']], f.status)),

async function boot() {
  const ok = S.staff ? true : await loadSession();
  if (!ok) return renderLogin();
  if (S.stage !== 'full') return renderSetup();
  renderShell();
  if (!location.hash) location.hash = '#/dashboard'; else router();
  if (!window.__badgeTimer) window.__badgeTimer = setInterval(() => { if (S.staff && S.stage === 'full' && !document.hidden) refreshBadge(); }, 60000);
}
boot();
